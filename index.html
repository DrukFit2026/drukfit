<style>
/* Layout: one-screen app. Sidebar on wide screens, bottom tab bar on phones; content column max 1100px. */
:root{
  --bg:#12161c; --surface:#1a2028; --raised:#232b35; --line:#2e3844; --ink:#eef1f4; --muted:#9aa6b2; --faint:#6b7684;
  --accent:#f5b83d; --accent-ink:#1d1503; --accent-soft:rgba(245,184,61,.14);
  --blue:#64a3ff; --blue-soft:rgba(100,163,255,.14);
  --good:#41d39a; --good-soft:rgba(65,211,154,.14); --warn:#f39c3a; --bad:#ff6f6f; --bad-soft:rgba(255,111,111,.14);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px; --r-sm:10px; --tab-h:64px;
  color-scheme:dark;
}
:root.t-light, :root.t-system[data-theme="light"]{
  --bg:#f2f4f6; --surface:#ffffff; --raised:#eceff3; --line:#d9dee5; --ink:#141a21; --muted:#56616d; --faint:#87919c;
  --accent:#c98a0c; --accent-ink:#ffffff; --accent-soft:rgba(201,138,12,.12);
  --blue:#2f6fd6; --blue-soft:rgba(47,111,214,.1);
  --good:#178a5c; --good-soft:rgba(23,138,92,.1); --warn:#c46a0b; --bad:#cc3b3b; --bad-soft:rgba(204,59,59,.1);
  color-scheme:light;
}
@media (prefers-color-scheme: light){ :root.t-system:not([data-theme="dark"]){
  --bg:#f2f4f6; --surface:#ffffff; --raised:#eceff3; --line:#d9dee5; --ink:#141a21; --muted:#56616d; --faint:#87919c;
  --accent:#c98a0c; --accent-ink:#ffffff; --accent-soft:rgba(201,138,12,.12);
  --blue:#2f6fd6; --blue-soft:rgba(47,111,214,.1);
  --good:#178a5c; --good-soft:rgba(23,138,92,.1); --warn:#c46a0b; --bad:#cc3b3b; --bad-soft:rgba(204,59,59,.1);
  color-scheme:light; } }
html,body{ height:100%; }
html{ scroll-padding-top:80px; scroll-padding-bottom:calc(var(--tab-h) + 96px); }
body.resting .main{ padding-bottom:calc(var(--tab-h) + 110px + env(safe-area-inset-bottom,0px)); }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent; }
*{ box-sizing:border-box; }
button,input,select,textarea{ font:inherit; color:inherit; }
h1,h2,h3{ font-family:var(--f-display); font-weight:700; letter-spacing:.01em; line-height:1.1; margin:0; text-wrap:balance; }
h1{ font-size:2rem; } h2{ font-size:1.45rem; } h3{ font-size:1.15rem; }
p{ margin:0; }
.num{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.muted{ color:var(--muted); } .faint{ color:var(--faint); } .small{ font-size:.85rem; } .tiny{ font-size:.75rem; }
.eyebrow{ font-family:var(--f-display); text-transform:uppercase; letter-spacing:.12em; font-size:.8rem; font-weight:600; color:var(--muted); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* Shell */
.app{ display:flex; min-height:100%; }
.side{ display:none; }
.main{ flex:1; min-width:0; padding-inline:16px; padding-block:12px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px)); max-width:1100px; margin-inline:auto; width:100%; }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); display:flex; align-items:center; gap:12px; padding-block:10px; margin-bottom:6px; }
.topbar h1{ font-size:1.6rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sync{ display:inline-flex; align-items:center; gap:6px; font-size:.75rem; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:3px 9px; white-space:nowrap; background:none; cursor:pointer; }
.sync i{ width:7px; height:7px; border-radius:50%; background:var(--faint); }
.sync.ok i{ background:var(--good); } .sync.local i{ background:var(--warn); } .sync.busy i{ background:var(--blue); }
.avatar{ width:38px; height:38px; border-radius:50%; background:var(--raised); border:1px solid var(--line); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; cursor:pointer; flex:none; }
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(6,1fr); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar a{ height:var(--tab-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); text-decoration:none; font-size:.68rem; font-weight:600; letter-spacing:.02em; }
.tabbar a svg{ width:23px; height:23px; }
.tabbar a.on{ color:var(--accent); }
.tabbar a.go span.dot{ width:46px; height:46px; margin-top:-6px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 6px 18px rgba(0,0,0,.3); }
.tabbar a.go{ color:var(--ink); }
.tabbar a.go.live span.dot{ animation:pulse 2s infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 var(--accent-soft);} 50%{ box-shadow:0 0 0 8px var(--accent-soft);} }
@media (min-width:900px){
  .tabbar{ display:none; }
  .side{ display:flex; flex-direction:column; gap:4px; width:230px; flex:none; padding:20px 14px; border-right:1px solid var(--line); position:sticky; top:0; height:100vh; background:var(--surface); }
  .side .brand{ font-family:var(--f-display); font-size:1.5rem; font-weight:700; padding:4px 10px 18px; letter-spacing:.02em; }
  .side .brand b{ color:var(--accent); }
  .side a{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:var(--muted); text-decoration:none; font-weight:600; }
  .side a svg{ width:20px; height:20px; }
  .side a:hover{ background:var(--raised); color:var(--ink); }
  .side a.on{ background:var(--accent-soft); color:var(--ink); }
  .side a.on svg{ color:var(--accent); }
  .side .go-btn{ margin-top:10px; }
  .main{ padding-block:16px 40px; padding-inline:28px; }
}

svg.i{ width:1.2em; height:1.2em; flex:none; vertical-align:-.2em; }
body.resting .toast{ bottom:calc(var(--tab-h) + 100px + env(safe-area-inset-bottom,0px)); }
.ctip{ position:absolute; z-index:90; transform:translate(-50%,-100%); background:var(--ink); color:var(--bg); font-family:var(--f-mono); font-size:.75rem; padding:5px 9px; border-radius:8px; pointer-events:none; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.25); }
.chart .hit{ cursor:crosshair; }
.boot{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
.spin{ width:34px; height:34px; border-radius:50%; border:3px solid var(--raised); border-top-color:var(--accent); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
/* Building blocks */
.stack{ display:flex; flex-direction:column; gap:14px; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.between{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); }
.grid-2{ display:grid; gap:10px; grid-template-columns:1fr 1fr; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; min-width:0; }
.card.flat{ background:transparent; }
.card h3{ margin-bottom:10px; }
.section-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:6px 2px -2px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--raised); font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap; transition:transform .08s, background .15s; }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,transparent); background:var(--bad-soft); }
.btn.big{ min-height:56px; font-size:1.1rem; padding:0 22px; border-radius:14px; font-family:var(--f-display); letter-spacing:.04em; text-transform:uppercase; }
.btn.sm{ min-height:34px; padding:0 11px; font-size:.85rem; border-radius:9px; }
.btn.icon{ width:44px; padding:0; }
.btn.block{ width:100%; }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.chip{ display:inline-flex; align-items:center; gap:6px; border-radius:99px; padding:3px 10px; font-size:.78rem; font-weight:600; border:1px solid var(--line); color:var(--muted); background:transparent; }
.chip.accent{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.chip.good{ background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip.bad{ background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip.blue{ background:var(--blue-soft); color:var(--blue); border-color:transparent; }
.tag-est{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--blue); border:1px dashed color-mix(in srgb,var(--blue) 55%,transparent); border-radius:6px; padding:1px 6px; white-space:nowrap; }
.tag-ai{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 50%,transparent); border-radius:6px; padding:1px 6px; white-space:nowrap; }
.tag-rec{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--good); border:1px solid color-mix(in srgb,var(--good) 50%,transparent); border-radius:6px; padding:1px 6px; white-space:nowrap; }
.seg{ display:flex; gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow-x:auto; scrollbar-width:none; }
.seg button{ flex:1; min-height:38px; border:0; background:transparent; border-radius:9px; padding:0 12px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; }
.seg button.on{ background:var(--raised); color:var(--ink); box-shadow:0 1px 0 var(--line); }
label.f{ display:flex; flex-direction:column; gap:6px; font-size:.85rem; font-weight:600; color:var(--muted); min-width:0; }
input.in, select.in, textarea.in{ width:100%; min-height:46px; border-radius:11px; border:1px solid var(--line); background:var(--bg); padding:10px 12px; font-size:16px; color:var(--ink); }
textarea.in{ min-height:80px; resize:vertical; }
input.in:focus, select.in:focus, textarea.in:focus{ border-color:var(--accent); outline:none; }
.opts{ display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr)); }
.opt{ position:relative; display:flex; flex-direction:column; gap:2px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-weight:600; text-align:left; }
.opt small{ font-weight:400; color:var(--muted); font-size:.8rem; }
.opt.on{ border-color:var(--accent); background:var(--accent-soft); }
.daypick{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.daypick button{ min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-weight:700; cursor:pointer; }
.daypick button.on{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.bar{ height:8px; border-radius:99px; background:var(--raised); overflow:hidden; }
.bar > i{ display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .4s; }
.bar.blue > i{ background:var(--blue); } .bar.good > i{ background:var(--good); } .bar.over > i{ background:var(--warn); }
.list{ display:flex; flex-direction:column; }
.li{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); min-width:0; }
.li:first-child{ border-top:0; }
.li .grow{ flex:1; min-width:0; }
.li .t{ font-weight:600; overflow-wrap:anywhere; }
.empty{ text-align:center; padding:26px 12px; color:var(--muted); display:flex; flex-direction:column; gap:10px; align-items:center; }
.note{ border-radius:12px; padding:12px 14px; background:var(--blue-soft); color:var(--ink); font-size:.92rem; display:flex; gap:10px; align-items:flex-start; }
.note.warn{ background:var(--accent-soft); } .note.bad{ background:var(--bad-soft); } .note.good{ background:var(--good-soft); }
.kpi{ display:flex; flex-direction:column; gap:2px; }
.kpi .v{ font-family:var(--f-display); font-size:2rem; font-weight:700; line-height:1; }
.kpi .v small{ font-size:1rem; color:var(--muted); font-weight:600; margin-left:3px; }
.hscroll{ overflow-x:auto; scrollbar-width:thin; }
table.t{ width:100%; border-collapse:collapse; font-size:.9rem; }
table.t th{ text-align:left; color:var(--muted); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.t td{ padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.chart text{ fill:var(--muted); font-family:var(--f-mono); font-size:10px; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--muted); }
.legend i{ display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }

/* Today hero */
.hero{ position:relative; overflow:hidden; border-radius:18px; padding:20px; background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 16%, var(--surface)), var(--surface) 60%); border:1px solid color-mix(in srgb,var(--accent) 30%, var(--line)); }
.hero h2{ font-size:2.3rem; text-transform:uppercase; letter-spacing:.02em; }
.hero .plates{ position:absolute; right:-28px; top:-28px; width:150px; height:150px; opacity:.16; pointer-events:none; }
.daystrip{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
.daystrip .d{ border-radius:11px; border:1px solid var(--line); padding:8px 4px; text-align:center; font-size:.72rem; display:flex; flex-direction:column; gap:3px; min-width:0; }
.daystrip .d b{ font-family:var(--f-display); font-size:1.05rem; }
.daystrip .d .w{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.daystrip .d.today{ border-color:var(--accent); }
.daystrip .d.done{ background:var(--good-soft); border-color:transparent; }
.daystrip .d.train .w{ color:var(--ink); font-weight:600; }
.ring{ --p:0; width:74px; height:74px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--raised) 0); display:grid; place-items:center; flex:none; }
.ring > span{ width:58px; height:58px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:1.2rem; }

/* Active workout */
.wk-head{ position:sticky; top:env(safe-area-inset-top,0px); z-index:25; background:var(--bg); padding-block:8px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); margin-inline:-16px; padding-inline:16px; }
.wk-head .clock{ font-family:var(--f-mono); font-size:1.15rem; font-weight:600; }
.ex{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 12px; }
.ex.done{ border-color:color-mix(in srgb,var(--good) 45%, var(--line)); }
.ex-h{ display:flex; gap:10px; align-items:flex-start; }
.ex-h .nm{ flex:1; min-width:0; }
.ex-h .nm h3{ font-size:1.25rem; margin:0; }
.sug{ margin-top:10px; padding:9px 11px; border-radius:10px; background:var(--accent-soft); font-size:.88rem; display:flex; gap:8px; align-items:flex-start; cursor:pointer; text-align:left; border:0; width:100%; }
.sug b{ color:var(--accent); }
.sets{ display:grid; grid-template-columns:28px minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.9fr) 52px; gap:6px; align-items:center; margin-top:12px; }
.sets .hd{ font-size:.68rem; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; font-weight:700; text-align:center; }
.sets .n{ font-family:var(--f-display); font-weight:700; text-align:center; color:var(--muted); }
.sets .prev{ font-family:var(--f-mono); font-size:.75rem; color:var(--faint); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sets input, .sets select{ width:100%; min-width:0; height:46px; border-radius:10px; border:1px solid var(--line); background:var(--bg); text-align:center; font-family:var(--f-mono); font-size:17px; font-weight:600; padding:0 2px; color:var(--ink); }
.sets select{ font-size:15px; -webkit-appearance:none; appearance:none; }
.sets .ok{ height:46px; border-radius:10px; border:1px solid var(--line); background:var(--raised); display:grid; place-items:center; cursor:pointer; }
.sets .ok svg{ width:22px; height:22px; color:var(--faint); }
.sets .row-done input, .sets .row-done select{ background:var(--good-soft); border-color:transparent; }
.sets .ok.on{ background:var(--good); border-color:transparent; }
.sets .ok.on svg{ color:#06281b; }
.restbar{ position:fixed; left:0; right:0; bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px)); z-index:29; padding:10px 16px; background:var(--raised); border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }
@media (min-width:900px){ .restbar{ bottom:0; left:230px; padding-bottom:12px; } }
.restbar .tm{ font-family:var(--f-mono); font-size:1.6rem; font-weight:600; min-width:84px; }
.restbar .prog{ position:absolute; left:0; top:-3px; height:3px; background:var(--accent); transition:width .25s linear; }

const pad2 = n => String(n).padStart(2,'0');
function isoDate(d){ d = d ? new Date(d) : new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate()+n); return isoDate(d); }
function dowOf(s){ return parseISO(s).getDay(); }
function weekStart(s){ const d = dowOf(s); return addDays(s, d === 0 ? -6 : 1 - d); } // Monday
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function roundTo(x, step){ if (!step) return Math.round(x); return Math.round(x / step) * step; }
function r1(x){ return Math.round(x * 10) / 10; }
function e1rm(w, r){ if (!w || !r) return 0; return w * (1 + Math.min(r, 12) / 30); }
function avg(a){ const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; }
function sum(a){ return a.reduce((s,x)=>s+(x||0),0); }

/* ===== Charts (SVG, theme-aware) ===== */
function niceTicks(min, max, n){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min; const step0 = span / (n || 4); const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m => m * mag).find(s => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step; const out = [];
  for (let v = lo; v <= hi + step/2; v += step) out.push(Math.round(v * 1000) / 1000);

}
// series: [{ name, color, pts:[{x:'YYYY-MM-DD'|number, y}], dashed, area }], opts: { h, target, unit, xType:'date'|'cat', labels }
function lineChart(series, opts){
  opts = opts || {}; const W = 640, H = opts.h || 200, L = 40, R = 14, T = 12, B = 26;
  const all = series.flatMap(s => s.pts); if (!all.length) return `<div class="empty small">No data yet</div>`;
  const xs = all.map(p => typeof p.x === 'string' ? parseISO(p.x).getTime() : p.x);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1){ x0 -= 86400000; x1 += 86400000; }
  const ysAll = all.map(p => p.y).concat(opts.target != null ? [opts.target] : []);
  let y0 = Math.min(...ysAll), y1 = Math.max(...ysAll); const padY = (y1 - y0) * 0.12 || Math.max(1, Math.abs(y1) * 0.05); y0 -= padY; y1 += padY;
  if (opts.zero) y0 = Math.min(0, y0);
  const ticks = niceTicks(y0, y1, 4); y0 = ticks[0]; y1 = ticks[ticks.length-1];
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  ticks.forEach(t => { g += `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${t}</text>`; });
  const nx = 4; for (let i = 0; i <= nx; i++){ const xv = x0 + (x1 - x0) * i / nx; const d = new Date(xv); g += `<text x="${X(xv)}" y="${H-8}" text-anchor="${i===0?'start':i===nx?'end':'middle'}">${d.getDate()} ${d.toLocaleDateString('en-AU',{month:'short'})}</text>`; }
  if (opts.target != null) g += `<line x1="${L}" x2="${W-R}" y1="${Y(opts.target)}" y2="${Y(opts.target)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${Y(opts.target)-5}" text-anchor="end" style="fill:var(--good)">target ${opts.target}${opts.unit||''}</text>`;
  series.forEach(s => {
    const pts = s.pts.map(p => [X(typeof p.x === 'string' ? parseISO(p.x).getTime() : p.x), Y(p.y)]);
    const d = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (s.area && pts.length > 1) g += `<path d="${d} L${pts[pts.length-1][0]} ${Y(y0)} L${pts[0][0]} ${Y(y0)} Z" fill="${s.color}" opacity=".12"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dashed ? 'stroke-dasharray="4 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => { const last = i === pts.length - 1; const tip = `${s.name ? s.name + ' · ' : ''}${typeof s.pts[i].x === 'string' ? fmtDate(s.pts[i].x) : s.pts[i].x}: ${s.pts[i].y}${opts.unit||''}`; if (pts.length < 40 || last) g += `<circle cx="${p[0]}" cy="${p[1]}" r="${last ? 4.5 : 2.6}" fill="${last ? s.color : 'var(--surface)'}" stroke="${s.color}" stroke-width="2"/>`; g += `<circle class="hit" cx="${p[0]}" cy="${p[1]}" r="11" fill="transparent" data-tip="${esc(tip)}"/>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'chart')}">${g}</svg>`;
}
// bars: [{ label, v, color }]
function barChart(bars, opts){
  opts = opts || {}; const W = 640, H = opts.h || 190, L = 40, R = 10, T = 12, B = 26;
  if (!bars.length) return `<div class="empty small">No data yet</div>`;
  const max = Math.max(1, ...bars.map(b => b.v), opts.target || 0); const ticks = niceTicks(0, max, 4); const y1 = ticks[ticks.length-1];
  const Y = y => T + (1 - y / y1) * (H - T - B); const bw = (W - L - R) / bars.length;
  let g = '';
  ticks.forEach(t => { g += `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${t >= 10000 ? Math.round(t/1000)+'k' : t}</text>`; });

  if (opts.target) g += `<line x1="${L}" x2="${W-R}" y1="${Y(opts.target)}" y2="${Y(opts.target)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/>`;

}

}

function approvedTarget(exId){
  const ap = Store.get('nextplan'); const d = isoDate();
  if (!ap || !ap.approvedAt || d < ap.ws || d > addDays(ap.ws, 6)) return null;

function buildActiveEx(pe, deload){

}

document.addEventListener('submit', e => { if (e.target.id !== 'coach-form') return; e.preventDefault(); const q = document.getElementById('coach-q').value.trim(); if (q) coachAsk(q); });
ACTIONS['coach-ask'] = el => coachAsk(el.dataset.q);
ACTIONS['coach-clear'] = () => { saveDoc('coach', { msgs:[] }); render(); };
let coachBusy = false;
async function coachAsk(q){
  if (coachBusy) return; coachBusy = true;
  const msgs = (S.coach.msgs || []).concat({ role:'user', text:q, t:Date.now() }).slice(-40);
  saveDoc('coach', { msgs }); render();
  const live = document.getElementById('chat-live'); const send = document.getElementById('coach-send'); if (send) send.disabled = true;
  let text = null, src = 'rules';
  const sample = S.settings.useAI === false ? null : await getSample();
  if (sample){
    if (live){ live.hidden = false; live.textContent = 'Thinking…'; live.scrollIntoView({ block:'end' }); }
    const hist = msgs.slice(-9, -1).map(m => `${m.role === 'user' ? 'User' : 'Coach'}: ${m.text}`).join('\n');
    const prompt = `${COACH_RULES}\n\nTODAY: ${isoDate()} (${DAY_NAMES[dowOf(isoDate())]})\n\nUSER DATA:\n${coachContext(S)}\n\n${hist ? 'RECENT CONVERSATION:\n' + hist + '\n\n' : ''}QUESTION: ${q}`;
    try { const res = await sample(prompt, { cache:false, onText: ({ text }) => { const l = document.getElementById('chat-live'); if (l){ l.hidden = false; l.textContent = text; } } }); text = res.text.trim(); src = 'ai'; }
    catch(err){ if (err && err.text) { text = err.text; src = 'ai'; } else if (err && err.code === 'rate_limited') toast('Claude is busy; answering with built-in rules'); }
  }
  if (!text) text = ruleCoach(S, q);
  saveDoc('coach', { msgs: msgs.concat({ role:'bot', text, src, t:Date.now() }).slice(-40) });
  coachBusy = false; render();
}
ACTIONS['ai-report'] = async el => {
  const sample = S.settings.useAI === false ? null : await getSample(); const st = document.getElementById('ai-rep-st');
  if (!sample){ st.textContent = 'Claude isn\'t available here (or is off in Settings). The rule-based report above uses your data.'; return; }
  el.disabled = true; st.textContent = 'Thinking…';
  const rp = weeklyReport(S, el.dataset.ws);
  const prompt = `${COACH_RULES}\n\nWrite a short weekly coaching summary (120-170 words) for the week ${rp.ws} to ${rp.we}: what improved, which lifts progressed, consistency, nutrition adherence, recovery or plateau signs, then three practical recommendations for next week as dashes. Use only the data below; if a section has no data, say it wasn't logged.\n\nWEEK FACTS (computed from logs): ${JSON.stringify({ recorded:rp.recorded, improved:rp.improved, progressing:rp.progressing, concerns:rp.concerns, ruleRecs:rp.recs })}\n\nUSER DATA:\n${coachContext(S)}`;
  try { const res = await sample(prompt, { onText: ({ text }) => { st.textContent = 'Writing…'; } }); const rep = Store.get('reports') || { ai:{} }; rep.ai = rep.ai || {}; rep.ai[rp.ws] = res.text.trim(); saveDoc('reports', rep); render(); }
  catch(err){ el.disabled = false; st.textContent = err && err.code === 'not_granted' ? 'You declined Claude access for this page. The rule-based report still works.' : 'Couldn\'t reach Claude. Try again shortly.'; }
};

const GOAL_LABEL = { muscle_gain:'Build muscle', fat_loss:'Lose fat', recomp:'Recomposition', strength:'Get stronger', endurance:'Endurance', general:'General fitness' };
function ringSvg(pct, color, size, label, value){
  const r = 42, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct || 0));
  return `<div class="pring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--raised)" stroke-width="9"/><circle class="arc" cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" style="--c:${c}" transform="rotate(-90 50 50)"/></svg><div class="pring-in"><b class="num">${value}</b>${label ? `<span>${label}</span>` : ''}</div></div>`;
}
function strengthChanges(){
  const since = addDays(isoDate(), -28); const out = [];
  const ids = [...new Set(S.sessions.filter(s => s.end).flatMap(s => s.exercises.map(e => e.exId)))].filter(id => EXERCISES[id] && EXERCISES[id].ratio);
  ids.forEach(id => { const h = exerciseHistory(S, id); const recent = h.filter(x => x.date >= since); const older = h.filter(x => x.date < since); const base = older[0] || recent[recent.length - 1]; if (!recent.length || !base || base === recent[0]) return; const a = bestE1rm(base), b = bestE1rm(recent[0]); if (b > a * 1.005) out.push({ name: EXERCISES[id].name, from: r1(a), to: r1(b), pct: Math.round((b - a) / a * 100) }); });
  return out.sort((x, y) => y.pct - x.pct).slice(0, 3);
}

      <div class="grid" style="margin-top:6px"><div><b class="small">Recovery</b><ul class="small">${rep.next.recovery.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div><b class="small">Priorities</b><ul class="small">${rep.next.priorities.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${rep.next.nutrition ? `<b class="small">Nutrition focus</b><p class="small">${esc(rep.next.nutrition)}</p>` : ''}</div></div>

        : `<div class="card flat stack" style="margin-top:12px"><b class="small">Review before it changes anything</b><label class="row small" style="cursor:pointer"><input type="checkbox" id="ap-w" checked style="width:20px;height:20px"> Use these weights and reps as next week's targets</label>${rep.next.deload ? `<label class="row small" style="cursor:pointer"><input type="checkbox" id="ap-d" checked style="width:20px;height:20px"> Make next week a deload week</label>` : ''}<p class="tiny faint">Your training days stay the same. Nothing changes until you approve.</p><button class="btn primary" data-act="rep-approve" data-ws="${rep.ws}">Approve plan</button></div>`}</section>` : `<p class="small muted">Next-week planning is offered on reports for the current or previous week.</p>`}
    <p class="tiny faint">Recorded figures come straight from your logs. Calories, protein and estimated 1RM are estimates. Suggestions are general fitness guidance, not medical advice.</p>
  </article>`;
}
ACTIONS['rep-save'] = el => { const ws = el.dataset.ws; const rep = buildWeekReport(S, ws); const r = Store.get('reports') || {}; const saved = { ...(r.saved || {}) }; saved[ws] = { savedAt: Date.now(), m: snapshotMetrics(rep.metrics), priorities: rep.review.priorities };
  const keys = Object.keys(saved).sort(); while (keys.length > 52) delete saved[keys.shift()];
  saveDoc('reports', { ...r, saved }); toast('Report saved to your account'); render(); };
ACTIONS['rep-approve'] = el => { const rep = buildWeekReport(S, el.dataset.ws); const nx = rep.next; if (!nx) return; const useW = document.getElementById('ap-w') ? document.getElementById('ap-w').checked : false; const useD = document.getElementById('ap-d') ? document.getElementById('ap-d').checked : false;
  const targets = {}; if (useW) nx.days.forEach(d => (d.exercises || []).forEach(e => { if (!targets[e.exId]) targets[e.exId] = { weight:e.weight, reps:e.reps, sets:e.sets }; }));
  saveDoc('nextplan', { ws: nx.ws, approvedAt: Date.now(), targets, deload: useD });
  if (useD) saveDoc('sched', { ...S.sched, deloadWeek: nx.ws, lastDeload: nx.ws });
  toast('Plan approved for next week'); render(); };
ACTIONS['rep-unapprove'] = () => { const ap = Store.get('nextplan'); if (ap && ap.deload && S.sched.deloadWeek === ap.ws){ const sc = { ...S.sched }; delete sc.deloadWeek; saveDoc('sched', sc); } saveDoc('nextplan', { ws:null }); toast('Approval undone'); render(); };
function pdfFile(ws){ const rep = buildWeekReport(S, ws); const bytes = reportPdf(rep, reportsDoc().ai[ws]); return { bytes, name:`DrukFit-week-${ws}.pdf` }; }
ACTIONS['rep-pdf'] = async el => {
  toast('Preparing PDF…'); const { bytes, name } = pdfFile(el.dataset.ws); const blob = new Blob([bytes], { type:'application/pdf' });
  if (framedView){
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (!dl){ toast('Downloads aren\'t available in this view'); return; }
    try { await dl.save({ filename:name, data:blob }); toast('PDF saved'); } catch(e){ if (e && e.code !== 'declined') toast('Couldn\'t save the PDF: ' + (e.message || 'try again')); }
  } else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('PDF downloaded'); }
};
ACTIONS['rep-share'] = async el => { const { bytes, name } = pdfFile(el.dataset.ws); const file = new File([bytes], name, { type:'application/pdf' }); try { await navigator.share({ files:[file], title:'DrukFit weekly report' }); } catch(e){ if (e && e.name !== 'AbortError') toast('Sharing failed. Export the PDF instead.'); } };
ACTIONS['rep-print'] = () => { document.body.classList.add('printing'); setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing'), 500); }, 50); };
ACTIONS['rep-compare-open'] = () => {
  const opts = [...new Set(weeksWithData(S).concat(Object.keys(reportsDoc().saved)))].sort().reverse();
  openSheet(`<form class="stack" id="cmp-f"><h2>Compare two weeks</h2><div class="grid-2"><label class="f" for="cmp-a">Week A<select class="in" id="cmp-a">${opts.map((w, i) => `<option value="${w}" ${i === 1 ? 'selected' : ''}>${fmtDate(w, { day:'numeric', month:'short', year:'numeric' })}</option>`).join('')}</select></label><label class="f" for="cmp-b">Week B<select class="in" id="cmp-b">${opts.map((w, i) => `<option value="${w}" ${i === 0 ? 'selected' : ''}>${fmtDate(w, { day:'numeric', month:'short', year:'numeric' })}</option>`).join('')}</select></label></div><button class="btn primary" type="submit">Compare</button></form>`,
    sh => sh.querySelector('#cmp-f').onsubmit = e => { e.preventDefault(); const a = sh.querySelector('#cmp-a').value, b = sh.querySelector('#cmp-b').value; if (a === b){ toast('Pick two different weeks'); return; } sub.cmpA = a < b ? a : b; sub.cmpB = a < b ? b : a; closeSheet(); render(); });
};
ACTIONS['rep-compare-close'] = () => { sub.cmpA = sub.cmpB = null; render(); };
function renderCompare(a, b){
  const rows = compareWeeks(S, a, b); const fa = fmtDate(a, { day:'numeric', month:'short' }), fb = fmtDate(b, { day:'numeric', month:'short' });
  const lowerBetter = []; const items = rows.filter(r => ['completed','sets','prs'].includes(r.key) && (r.a || r.b));
  return `<section class="card"><div class="between"><h3 style="margin:0">Week of ${fa} vs week of ${fb}</h3><button class="btn sm ghost" data-act="rep-compare-close">Close</button></div>
    <div class="hscroll" style="margin-top:10px"><table class="t"><thead><tr><th>Metric</th><th>${fa}</th><th>${fb}</th><th>Change</th></tr></thead><tbody>${rows.map(r => { const d = r.a != null && r.b != null ? r1(r.b - r.a) : null; return `<tr><td>${r.label}</td><td class="num">${r.a == null ? '–' : (r.key === 'volume' ? fmtNum(r.a) : r.a) + r.unit}</td><td class="num">${r.b == null ? '–' : (r.key === 'volume' ? fmtNum(r.b) : r.b) + r.unit}</td><td class="num" style="color:${d > 0 && !lowerBetter.includes(r.key) ? 'var(--good)' : d < 0 ? 'var(--muted)' : ''}">${d == null ? '–' : (d > 0 ? '+' : '') + (r.key === 'volume' ? fmtNum(d) : d)}</td></tr>`; }).join('')}</tbody></table></div>
    ${items.length ? groupedBars(items.map(r => ({ label:r.label, a:r.a || 0, b:r.b || 0 }))) + `<div class="legend"><span><i style="background:var(--faint)"></i>${fa}</span><span><i style="background:var(--accent)"></i>${fb}</span></div>` : ''}</section>`;
}
/* ===== Boot ===== */
(function boot(){
  Store.loadLocal(); rebuild();
  route = (location.hash || '#dashboard').slice(1) || 'dashboard';
  // roll deload week off after it ends
  if (S.sched.deloadWeek && S.sched.deloadWeek < weekStart(isoDate())) { const sc = { ...S.sched }; delete sc.deloadWeek; Store.docs.sched = sc; }
  render();
  Store.connect();
  window.addEventListener('pagehide', () => Store.flush());
})();
</script><script>
window.DRUKFIT_VERSION = "bebb5e71c8";
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const offer = w => { const b = document.createElement('div'); b.className = 'note warn'; b.id = 'upd'; b.style.cssText = 'position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:95;box-shadow:0 10px 30px rgba(0,0,0,.4)';
        b.innerHTML = '<div class="grow"><b>A new version of DrukFit is ready.</b><div class="small muted">Your data stays on this phone.</div></div><button class="btn sm primary" id="upd-go">Update now</button>';
        if (!document.getElementById('upd')) document.body.appendChild(b); document.getElementById('upd-go').onclick = () => { Store.flush && Store.flush(); w.postMessage('skipWaiting'); }; };
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(e => console.warn('SW registration failed', e));
    let reloading = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
  });
}
