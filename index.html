if (CLOUD){
  ACTIONS['wipe'] = () => openSheet(`<form class="stack" id="del-f" novalidate><h2>Delete account permanently?</h2><p class="small">This deletes your DrukFit account, profile, plans, every workout, food log, measurement, report and progress photo. It can't be undone. <a href="#settings" class="link" data-act="export">Export your data first</a> if you want a copy.</p>${formErr()}
    ${pwField('del-pw', 'Password', 'current-password')}<label class="f" for="del-t">Type DELETE to confirm<input class="in" id="del-t" autocomplete="off" required></label>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn danger" type="submit" id="del-go">Delete my account</button></div></form>`, sh => sh.querySelector('#del-f').onsubmit = async e => {
      e.preventDefault(); if (sh.querySelector('#del-t').value.trim().toUpperCase() !== 'DELETE') return showErr('Type DELETE to confirm.', 'del-t');
      const b = sh.querySelector('#del-go'); setBusy(b, true, 'Deleting…');
      try { await Auth.verifyPassword(sh.querySelector('#del-pw').value); } catch(err){ setBusy(b, false, 'Delete my account'); return showErr(err.offline ? friendlyAuthError(err) : 'Password is incorrect.', 'del-pw'); }
      try {
        const files = await Auth.api('/storage/v1/object/list/progress-photos', { method:'POST', json:{ prefix: Cloud.uid, limit: 1000, offset: 0 } });
        const paths = (files || []).filter(f => f.name).map(f => Cloud.uid + '/' + f.name);
        if (paths.length) await Auth.api('/storage/v1/object/progress-photos', { method:'DELETE', json:{ prefixes: paths } });
        await Auth.api('/rest/v1/rpc/delete_my_account', { method:'POST', json:{} });
      } catch(err){ setBusy(b, false, 'Delete my account'); return showErr('Couldn\'t delete your account: ' + friendlyAuthError(err) + ' Nothing has been deleted from this device.'); }
      closeSheet(); Store.clearLocal(); Auth.persist(null); Cloud.phase = 'out'; Cloud.meta = { revs:{}, pending:[], photoQueue:[], lastSync:0 }; rebuild(); location.hash = 'welcome'; render(); toast('Your account and data have been deleted');
    });
  ACTIONS['sync-info'] = () => openSheet(`<div class="stack"><h2>Your data</h2>
    ${Store.status === 'error' ? `<div class="note bad">${I('info')}<div class="small">Some changes couldn't be saved to your account yet. They're safe on this device and DrukFit keeps retrying.</div></div>` : Store.status === 'offline' ? `<div class="note warn">${I('info')}<div class="small">You're offline. Changes are saved on this device and sync automatically when you reconnect.</div></div>` : `<div class="note good">${I('check')}<div class="small">Saved to your private DrukFit account (${esc(Auth.user ? Auth.user.email : '')}) and available on any device you log in on.</div></div>`}
    <p class="small muted">${Cloud.meta.lastSync ? 'Last synced ' + new Date(Cloud.meta.lastSync).toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit' }) + '. ' : ''}${Store.pending.size ? Store.pending.size + ' change(s) waiting to upload.' : 'Nothing waiting to upload.'}</p>
    <div class="row"><button class="btn primary" data-act="sync-now">Sync now</button><button class="btn ghost" data-act="close-sheet">Close</button></div></div>`);
}

/* ---------- Privacy policy & terms ---------- */
function legalView(which){
  const back = Auth.session ? '#settings' : '#welcome';
  const P = which === 'privacy' ? `<h1>Privacy policy</h1><p class="small muted">Version ${TERMS_VERSION} · DrukFit (drukfit.app)</p>
    <h3>What we collect</h3><ul><li><b>Account:</b> your email address, display name and a securely hashed password (we never see or store your actual password).</li><li><b>Fitness data you enter:</b> profile and goals, training plans, workouts (exercises, sets, reps, weights, rest), personal records, nutrition plans and food logs, body weight and measurements, progress photos, sleep and recovery logs, weekly reports and app settings.</li><li>Only what you choose to enter. Age, sex, measurements and photos are optional.</li></ul>
    <h3>How it's stored and protected</h3><ul><li>Data is stored with Supabase (hosted PostgreSQL and file storage), sent over HTTPS and encrypted at rest by the provider.</li><li>Database row-level security means each member can read and change only their own records. Progress photos are kept in a private storage folder that only your account can access.</li><li>A copy is kept on your device so the app works offline. Logging out removes it from that device.</li></ul>
    <h3>How it's used</h3><ul><li>Only to run DrukFit for you: your plan, suggestions, charts and reports. All suggestions are calculated in the app.</li><li>Your data is not sold, shared with advertisers or used for advertising. There are no third-party trackers.</li><li>Emails are sent only for your account (confirmation, password reset, email change).</li></ul>
    <h3>Your choices</h3><ul><li><b>Export:</b> Profile &amp; Settings → Export downloads all your records.</li><li><b>Delete:</b> Profile &amp; Settings → Delete account permanently removes your account, records and photos.</li><li>You can edit or delete individual records at any time.</li></ul>
    <h3>Health information</h3><p>DrukFit is a general fitness tool, not a medical service. Measurements and nutrition logs are treated as private personal data.</p>
    <h3>Contact</h3><p>Questions or requests about your data: contact the DrukFit operator at the email address you received your account emails from.</p>`
  : `<h1>Terms of use</h1><p class="small muted">Version ${TERMS_VERSION} · DrukFit (drukfit.app)</p>
    <ul><li>DrukFit provides general fitness and nutrition guidance for healthy adults. It is <b>not medical advice</b> and doesn't replace a doctor, physiotherapist or dietitian.</li><li>Check with a health professional before starting if you have an injury, a medical condition, are pregnant or have a history of disordered eating. Stop any exercise that causes pain.</li><li>Weights, calorie and macro targets are estimates. Use your judgement and train safely.</li><li>Keep your password private. You're responsible for activity on your account.</li><li>Don't misuse the service, attempt to access other members' data, or upload unlawful content.</li><li>The service is provided as is. We may update features or these terms; continued use means you accept the current version.</li><li>You can stop using DrukFit and delete your account at any time.</li></ul>`;
  return `<div class="authwrap" style="max-width:720px"><div class="authcard legal"><a href="${back}" class="small link">← Back</a>${P}</div></div>`;
}
/* ===== Boot ===== */
(function boot(){
  Store.loadLocal(); rebuild();
  route = (location.hash || '#dashboard').slice(1) || 'dashboard';
  // roll deload week off after it ends
  if (S.sched.deloadWeek && S.sched.deloadWeek < weekStart(isoDate())) { const sc = { ...S.sched }; delete sc.deloadWeek; Store.docs.sched = sc; }
  render();
  Store.connect();
  window.addEventListener('pagehide', () => Store.flush());
})();

      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(e => console.warn('SW registration failed', e));
    const hadController = !!navigator.serviceWorker.controller; // first install must not reload the page
    let reloading = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloading) { reloading = true; location.reload(); } });
  });
}
