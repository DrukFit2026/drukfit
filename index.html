<style>
/* Layout: one-screen app. Sidebar on wide screens, bottom tab bar on phones; content column max 1100px. */
:root{
  --bg:#12161c; --surface:#1a2028; --raised:#232b35; --line:#2e3844; --ink:#eef1f4; --muted:#9aa6b2; --faint:#6b7684;
  --accent:#f5b83d; --accent-ink:#1d1503; --accent-soft:rgba(245,184,61,.14);
  --blue:#64a3ff; --blue-soft:rgba(100,163,255,.14);
  --good:#41d39a; --good-soft:rgba(65,211,154,.14); --warn:#f39c3a; --bad:#ff6f6f; --bad-soft:rgba(255,111,111,.14);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px; --r-sm:10px; --tab-h:64px;
  color-scheme:dark;
}
:root.t-light, :root.t-system[data-theme="light"]{
  --bg:#f2f4f6; --surface:#ffffff; --raised:#eceff3; --line:#d9dee5; --ink:#141a21; --muted:#56616d; --faint:#87919c;
  --accent:#c98a0c; --accent-ink:#ffffff; --accent-soft:rgba(201,138,12,.12);
  --blue:#2f6fd6; --blue-soft:rgba(47,111,214,.1);
  --good:#178a5c; --good-soft:rgba(23,138,92,.1); --warn:#c46a0b; --bad:#cc3b3b; --bad-soft:rgba(204,59,59,.1);
  color-scheme:light;
}
@media (prefers-color-scheme: light){ :root.t-system:not([data-theme="dark"]){
  --bg:#f2f4f6; --surface:#ffffff; --raised:#eceff3; --line:#d9dee5; --ink:#141a21; --muted:#56616d; --faint:#87919c;
  --accent:#c98a0c; --accent-ink:#ffffff; --accent-soft:rgba(201,138,12,.12);
  --blue:#2f6fd6; --blue-soft:rgba(47,111,214,.1);
  --good:#178a5c; --good-soft:rgba(23,138,92,.1); --warn:#c46a0b; --bad:#cc3b3b; --bad-soft:rgba(204,59,59,.1);
  color-scheme:light; } }
html,body{ height:100%; }
html{ scroll-padding-top:80px; scroll-padding-bottom:calc(var(--tab-h) + 96px); }
body.resting .main{ padding-bottom:calc(var(--tab-h) + 110px + env(safe-area-inset-bottom,0px)); }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent; }
*{ box-sizing:border-box; }
button,input,select,textarea{ font:inherit; color:inherit; }
h1,h2,h3{ font-family:var(--f-display); font-weight:700; letter-spacing:.01em; line-height:1.1; margin:0; text-wrap:balance; }
h1{ font-size:2rem; } h2{ font-size:1.45rem; } h3{ font-size:1.15rem; }
p{ margin:0; }
.num{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.muted{ color:var(--muted); } .faint{ color:var(--faint); } .small{ font-size:.85rem; } .tiny{ font-size:.75rem; }
.eyebrow{ font-family:var(--f-display); text-transform:uppercase; letter-spacing:.12em; font-size:.8rem; font-weight:600; color:var(--muted); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* Shell */
.app{ display:flex; min-height:100%; }
.side{ display:none; }
.main{ flex:1; min-width:0; padding-inline:16px; padding-block:12px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px)); max-width:1100px; margin-inline:auto; width:100%; }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); display:flex; align-items:center; gap:12px; padding-block:10px; margin-bottom:6px; }
.topbar h1{ font-size:1.6rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sync{ display:inline-flex; align-items:center; gap:6px; font-size:.75rem; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:3px 9px; white-space:nowrap; background:none; cursor:pointer; }
.sync i{ width:7px; height:7px; border-radius:50%; background:var(--faint); }
.sync.ok i{ background:var(--good); } .sync.local i{ background:var(--warn); } .sync.busy i{ background:var(--blue); }
.avatar{ width:38px; height:38px; border-radius:50%; background:var(--raised); border:1px solid var(--line); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; cursor:pointer; flex:none; }
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(6,1fr); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar a{ height:var(--tab-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); text-decoration:none; font-size:.68rem; font-weight:600; letter-spacing:.02em; }
.tabbar a svg{ width:23px; height:23px; }
.tabbar a.on{ color:var(--accent); }
.tabbar a.go span.dot{ width:46px; height:46px; margin-top:-6px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 6px 18px rgba(0,0,0,.3); }
.tabbar a.go{ color:var(--ink); }
.tabbar a.go.live span.dot{ animation:pulse 2s infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 var(--accent-soft);} 50%{ box-shadow:0 0 0 8px var(--accent-soft);} }
@media (min-width:900px){
  .tabbar{ display:none; }
  .side{ display:flex; flex-direction:column; gap:4px; width:230px; flex:none; padding:20px 14px; border-right:1px solid var(--line); position:sticky; top:0; height:100vh; background:var(--surface); }
  .side .brand{ font-family:var(--f-display); font-size:1.5rem; font-weight:700; padding:4px 10px 18px; letter-spacing:.02em; }
  .side .brand b{ color:var(--accent); }
  .side a{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:var(--muted); text-decoration:none; font-weight:600; }
  .side a svg{ width:20px; height:20px; }
  .side a:hover{ background:var(--raised); color:var(--ink); }
  .side a.on{ background:var(--accent-soft); color:var(--ink); }
  .side a.on svg{ color:var(--accent); }
  .side .go-btn{ margin-top:10px; }
  .main{ padding-block:16px 40px; padding-inline:28px; }
}

svg.i{ width:1.2em; height:1.2em; flex:none; vertical-align:-.2em; }
body.resting .toast{ bottom:calc(var(--tab-h) + 100px + env(safe-area-inset-bottom,0px)); }
.ctip{ position:absolute; z-index:90; transform:translate(-50%,-100%); background:var(--ink); color:var(--bg); font-family:var(--f-mono); font-size:.75rem; padding:5px 9px; border-radius:8px; pointer-events:none; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.25); }
.chart .hit{ cursor:crosshair; }
.boot{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
.spin{ width:34px; height:34px; border-radius:50%; border:3px solid var(--raised); border-top-color:var(--accent); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
/* Building blocks */
.stack{ display:flex; flex-direction:column; gap:14px; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.between{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); }
.grid-2{ display:grid; gap:10px; grid-template-columns:1fr 1fr; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; min-width:0; }
.card.flat{ background:transparent; }
.card h3{ margin-bottom:10px; }
.section-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:6px 2px -2px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--raised); font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap; transition:transform .08s, background .15s; }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,transparent); background:var(--bad-soft); }
.btn.big{ min-height:56px; font-size:1.1rem; padding:0 22px; border-radius:14px; font-family:var(--f-display); letter-spacing:.04em; text-transform:uppercase; }
.btn.sm{ min-height:34px; padding:0 11px; font-size:.85rem; border-radius:9px; }
.btn.icon{ width:44px; padding:0; }
.btn.block{ width:100%; }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.chip{ display:inline-flex; align-items:center; gap:6px; border-radius:99px; padding:3px 10px; font-size:.78rem; font-weight:600; border:1px solid var(--line); color:var(--muted); background:transparent; }
.chip.accent{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.chip.good{ background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip.bad{ background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip.blue{ background:var(--blue-soft); color:var(--blue); border-color:transparent; }
.tag-est{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--blue); border:1px dashed color-mix(in srgb,var(--blue) 55%,transparent); border-radius:6px; padding:1px 6px; white-space:nowrap; }
.tag-ai{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 50%,transparent); border-radius:6px; padding:1px 6px; white-space:nowrap; }
.tag-rec{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--good); border:1px solid color-mix(in srgb,var(--good) 50%,transparent); border-radius:6px; padding:1px 6px; white-space:nowrap; }
.seg{ display:flex; gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow-x:auto; scrollbar-width:none; }
.seg button{ flex:1; min-height:38px; border:0; background:transparent; border-radius:9px; padding:0 12px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; }
.seg button.on{ background:var(--raised); color:var(--ink); box-shadow:0 1px 0 var(--line); }
label.f{ display:flex; flex-direction:column; gap:6px; font-size:.85rem; font-weight:600; color:var(--muted); min-width:0; }
input.in, select.in, textarea.in{ width:100%; min-height:46px; border-radius:11px; border:1px solid var(--line); background:var(--bg); padding:10px 12px; font-size:16px; color:var(--ink); }
textarea.in{ min-height:80px; resize:vertical; }
input.in:focus, select.in:focus, textarea.in:focus{ border-color:var(--accent); outline:none; }
.opts{ display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr)); }
.opt{ position:relative; display:flex; flex-direction:column; gap:2px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-weight:600; text-align:left; }
.opt small{ font-weight:400; color:var(--muted); font-size:.8rem; }
.opt.on{ border-color:var(--accent); background:var(--accent-soft); }
.daypick{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.daypick button{ min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-weight:700; cursor:pointer; }
.daypick button.on{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.bar{ height:8px; border-radius:99px; background:var(--raised); overflow:hidden; }
.bar > i{ display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .4s; }
.bar.blue > i{ background:var(--blue); } .bar.good > i{ background:var(--good); } .bar.over > i{ background:var(--warn); }
.list{ display:flex; flex-direction:column; }
.li{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); min-width:0; }
.li:first-child{ border-top:0; }
.li .grow{ flex:1; min-width:0; }
.li .t{ font-weight:600; overflow-wrap:anywhere; }
.empty{ text-align:center; padding:26px 12px; color:var(--muted); display:flex; flex-direction:column; gap:10px; align-items:center; }
.note{ border-radius:12px; padding:12px 14px; background:var(--blue-soft); color:var(--ink); font-size:.92rem; display:flex; gap:10px; align-items:flex-start; }
.note.warn{ background:var(--accent-soft); } .note.bad{ background:var(--bad-soft); } .note.good{ background:var(--good-soft); }
.kpi{ display:flex; flex-direction:column; gap:2px; }
.kpi .v{ font-family:var(--f-display); font-size:2rem; font-weight:700; line-height:1; }
.kpi .v small{ font-size:1rem; color:var(--muted); font-weight:600; margin-left:3px; }
.hscroll{ overflow-x:auto; scrollbar-width:thin; }
table.t{ width:100%; border-collapse:collapse; font-size:.9rem; }
table.t th{ text-align:left; color:var(--muted); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.t td{ padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.chart text{ fill:var(--muted); font-family:var(--f-mono); font-size:10px; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--muted); }
.legend i{ display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }

/* Today hero */
.hero{ position:relative; overflow:hidden; border-radius:18px; padding:20px; background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 16%, var(--surface)), var(--surface) 60%); border:1px solid color-mix(in srgb,var(--accent) 30%, var(--line)); }
.hero h2{ font-size:2.3rem; text-transform:uppercase; letter-spacing:.02em; }
.hero .plates{ position:absolute; right:-28px; top:-28px; width:150px; height:150px; opacity:.16; pointer-events:none; }
.daystrip{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
.daystrip .d{ border-radius:11px; border:1px solid var(--line); padding:8px 4px; text-align:center; font-size:.72rem; display:flex; flex-direction:column; gap:3px; min-width:0; }
.daystrip .d b{ font-family:var(--f-display); font-size:1.05rem; }
.daystrip .d .w{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.daystrip .d.today{ border-color:var(--accent); }
.daystrip .d.done{ background:var(--good-soft); border-color:transparent; }
.daystrip .d.train .w{ color:var(--ink); font-weight:600; }
.ring{ --p:0; width:74px; height:74px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--raised) 0); display:grid; place-items:center; flex:none; }
.ring > span{ width:58px; height:58px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:1.2rem; }

/* Active workout */
.wk-head{ position:sticky; top:env(safe-area-inset-top,0px); z-index:25; background:var(--bg); padding-block:8px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); margin-inline:-16px; padding-inline:16px; }
.wk-head .clock{ font-family:var(--f-mono); font-size:1.15rem; font-weight:600; }
.ex{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 12px; }
.ex.done{ border-color:color-mix(in srgb,var(--good) 45%, var(--line)); }
.ex-h{ display:flex; gap:10px; align-items:flex-start; }
.ex-h .nm{ flex:1; min-width:0; }
.ex-h .nm h3{ font-size:1.25rem; margin:0; }
.sug{ margin-top:10px; padding:9px 11px; border-radius:10px; background:var(--accent-soft); font-size:.88rem; display:flex; gap:8px; align-items:flex-start; cursor:pointer; text-align:left; border:0; width:100%; }
.sug b{ color:var(--accent); }
.sets{ display:grid; grid-template-columns:28px minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.9fr) 52px; gap:6px; align-items:center; margin-top:12px; }
.sets .hd{ font-size:.68rem; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; font-weight:700; text-align:center; }
.sets .n{ font-family:var(--f-display); font-weight:700; text-align:center; color:var(--muted); }
.sets .prev{ font-family:var(--f-mono); font-size:.75rem; color:var(--faint); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sets input, .sets select{ width:100%; min-width:0; height:46px; border-radius:10px; border:1px solid var(--line); background:var(--bg); text-align:center; font-family:var(--f-mono); font-size:17px; font-weight:600; padding:0 2px; color:var(--ink); }
.sets select{ font-size:15px; -webkit-appearance:none; appearance:none; }
.sets .ok{ height:46px; border-radius:10px; border:1px solid var(--line); background:var(--raised); display:grid; place-items:center; cursor:pointer; }
.sets .ok svg{ width:22px; height:22px; color:var(--faint); }
.sets .row-done input, .sets .row-done select{ background:var(--good-soft); border-color:transparent; }
.sets .ok.on{ background:var(--good); border-color:transparent; }
.sets .ok.on svg{ color:#06281b; }
.restbar{ position:fixed; left:0; right:0; bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px)); z-index:29; padding:10px 16px; background:var(--raised); border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }
@media (min-width:900px){ .restbar{ bottom:0; left:230px; padding-bottom:12px; } }
.restbar .tm{ font-family:var(--f-mono); font-size:1.6rem; font-weight:600; min-width:84px; }
.restbar .prog{ position:absolute; left:0; top:-3px; height:3px; background:var(--accent); transition:width .25s linear; }

/* Sheet / modal */

/* Calendar */

/* Chat */

/* Photos */

const pad2 = n => String(n).padStart(2,'0');
function isoDate(d){ d = d ? new Date(d) : new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate()+n); return isoDate(d); }
function dowOf(s){ return parseISO(s).getDay(); }
function weekStart(s){ const d = dowOf(s); return addDays(s, d === 0 ? -6 : 1 - d); } // Monday
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function roundTo(x, step){ if (!step) return Math.round(x); return Math.round(x / step) * step; }
function r1(x){ return Math.round(x * 10) / 10; }
function e1rm(w, r){ if (!w || !r) return 0; return w * (1 + Math.min(r, 12) / 30); }
function avg(a){ const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; }
function sum(a){ return a.reduce((s,x)=>s+(x||0),0); }

function autoSplit(days){ return days <= 3 ? 'full' : days === 4 ? 'ul' : days === 5 ? 'ul' : 'ppl'; }
function splitWorkouts(splitKey, days){
  if (splitKey === 'ul' && days === 5) return ['upperA','lowerA','push','pull','legs'];
  const s = SPLITS[splitKey] || SPLITS.full; return s.byDays[Math.max(1, Math.min(6, days))];
}
function limitationTags(profile){
  const t = new Set(profile.limitations || []);
  return t;
}
function avoidedNames(profile){
  return (profile.avoid || '').toLowerCase().split(/[,;\n]/).map(s=>s.trim()).filter(s => s.length > 2);
}
function exerciseAllowed(ex, profile, equipList){
  if (!equipList.includes(ex.equip)) return false;
  const lim = limitationTags(profile);
  if (ex.stress.some(s => lim.has(s))) return false;
  const av = avoidedNames(profile);
  if (av.some(a => ex.name.toLowerCase().includes(a))) return false;
  return true;
}
function candidatesFor(pattern, profile, equipList, used){
  let list = Object.values(EXERCISES).filter(e => e.pattern === pattern && !used.has(e.id) && exerciseAllowed(e, profile, equipList));
  if (profile.experience === 'beginner') list.sort((a,b) => (BEGINNER_DEPRIORITISE.includes(a.id)?1:0) - (BEGINNER_DEPRIORITISE.includes(b.id)?1:0));
  return list;
}
function pickExercise(pattern, profile, equipList, used, variant){
  let list = candidatesFor(pattern, profile, equipList, used);
  if (!list.length && PATTERN_FALLBACK[pattern]) list = candidatesFor(PATTERN_FALLBACK[pattern], profile, equipList, used);
  if (!list.length) return null;
  return list[Math.min(variant || 0, list.length - 1)];
}
function repScheme(goal, ex, index, experience){
  const iso = !ex.compound;
  let s;
  if (ex.pattern === 'core') s = ex.id === 'plank' ? {sets:3, repMin:30, repMax:45, rest:60} : {sets:3, repMin:8, repMax:12, rest:60};
  else if (goal === 'strength') s = !iso && index < 2 ? {sets:4, repMin:4, repMax:6, rest:180} : !iso ? {sets:3, repMin:6, repMax:10, rest:120} : {sets:3, repMin:10, repMax:12, rest:75};
  else if (goal === 'fat_loss') s = !iso ? {sets:3, repMin:8, repMax:12, rest:90} : {sets:3, repMin:12, repMax:15, rest:60};
  else if (goal === 'endurance') s = !iso ? {sets:3, repMin:12, repMax:15, rest:60} : {sets:2, repMin:15, repMax:20, rest:45};
  else if (goal === 'muscle_gain' || goal === 'recomp') s = !iso && index === 0 ? {sets:3, repMin:6, repMax:10, rest:150} : !iso ? {sets:3, repMin:8, repMax:12, rest:90} : {sets:3, repMin:10, repMax:15, rest:60};
  else s = !iso ? {sets:3, repMin:8, repMax:12, rest:90} : {sets:2, repMin:10, repMax:15, rest:60};
  if (experience === 'beginner') s.sets = Math.min(s.sets, 3);
  if (experience === 'advanced' && !iso && goal !== 'endurance') s.sets = Math.min(s.sets + 1, 5);
  return s;
}
function startingWeight(ex, profile, repMax){
  if (!ex.ratio || !profile.weightKg) return 0;
  const exp = {beginner:0.55, intermediate:0.8, advanced:1.0}[profile.experience] || 0.6;
  const lower = ['squat','hinge','lunge','quad-iso','ham-iso','calf'].includes(ex.pattern);
  const sex = profile.sex === 'female' ? (lower ? 0.75 : 0.6) : profile.sex === 'male' ? 1 : (lower ? 0.85 : 0.78);
  const repF = repMax <= 6 ? 1.1 : repMax >= 15 ? 0.8 : 1;
  const w = profile.weightKg * ex.ratio * exp * sex * repF;
  const inc = ex.inc || 2.5;
  return Math.max(ex.equip === 'barbell' ? 20 : inc, roundTo(w, inc));
}
const DURATION_EXERCISES = {30:4, 45:5, 60:6, 75:7, 90:8};
function buildWorkout(tplKey, profile, idx){
  const tpl = SLOT_TEMPLATES[tplKey];
  const equipList = EQUIP_SETS[profile.equipment || 'full'];
  const maxN = DURATION_EXERCISES[profile.duration || 60] || 6;
  const used = new Set(); const exercises = [];
  for (const slot of tpl.slots){
    if (exercises.length >= maxN) break;
    const ex = pickExercise(slot, profile, equipList, used, tpl.variant || 0);
    if (!ex) continue;
    used.add(ex.id);
    const sch = repScheme(profile.goal, ex, exercises.length, profile.experience);
    exercises.push({ exId: ex.id, ...sch, start: startingWeight(ex, profile, sch.repMax) });
  }
  let cardio = null;
  if (profile.goal === 'fat_loss' || profile.goal === 'endurance' || profile.goal === 'general') {
    const c = ['bike','row-erg','incline-walk','brisk-walk'].map(id => EXERCISES[id]).find(e => exerciseAllowed(e, profile, EQUIP_SETS[profile.equipment || 'full']));
    if (c) cardio = { exId: c.id, minutes: profile.goal === 'endurance' ? 20 : 10 };
  }
  return { id: tplKey + '-' + idx, tpl: tplKey, name: tpl.name, focus: tpl.focus, exercises, cardio };
}
function generatePlan(profile){
  const days = Math.max(1, Math.min(7, profile.daysPerWeek || 3));
  const splitKey = profile.split && profile.split !== 'auto' ? profile.split : autoSplit(Math.min(days, 6));
  const tpls = splitWorkouts(splitKey, Math.min(days, 6));
  const seen = {}; const workouts = []; const rotation = [];
  tpls.forEach((k, i) => {
    if (seen[k]) { rotation.push(seen[k]); return; }
    const w = buildWorkout(k, profile, i); seen[k] = w.id; workouts.push(w); rotation.push(w.id);
  });
  if (days === 7) { // 7th day is active recovery
    const m = { id:'mobility-7', tpl:'mobility', name:'Mobility & Recovery', focus:'Active recovery', exercises:[{exId:'mobility', sets:1, repMin:15, repMax:20, rest:0, start:0}], cardio:{exId:'brisk-walk', minutes:20} };
    workouts.push(m); rotation.push(m.id);
  }
  let trainDays = (profile.trainDays && profile.trainDays.length === days) ? profile.trainDays.slice().sort() : DEFAULT_TRAIN_DAYS[days];
  return { split: splitKey, splitLabel: (SPLITS[splitKey]||{}).label || 'Custom', workouts, rotation, trainDays, pointer: 0, generatedAt: Date.now(), version: 1 };
}
function warmupFor(workout){
  const first = workout.exercises[0] && EXERCISES[workout.exercises[0].exId];
  const lines = ['5 min easy bike, row or brisk walk', 'Dynamic mobility: leg swings, hip openers, arm circles (2 min)'];
  if (first && first.ratio) lines.push(`Ramp-up sets on ${first.name}: empty bar/light x10, ~50% x6, ~75% x3, then working sets`);
  return lines;
}
function estimateDuration(workout){
  let sec = 8 * 60; // warm-up
  for (const e of workout.exercises){ sec += e.sets * (45 + (e.rest || 60)); }
  if (workout.cardio) sec += workout.cardio.minutes * 60;
  return Math.round(sec / 60 / 5) * 5;
}

/* ---------- Schedule ---------- */
function isTrainingDay(S, date){
  const sc = S.sched || {}; const plan = S.plan; if (!plan) return false;
  if ((sc.extra || {})[date]) return true;
  if ((sc.rest || {})[date]) return false;
  return plan.trainDays.includes(dowOf(date));
}
function sessionsOn(S, date){ return S.sessions.filter(s => s.date === date && s.end); }
function workoutById(S, id){ return S.plan && S.plan.workouts.find(w => w.id === id); }
// Project the rotation onto upcoming dates. A missed day never doubles up: the next workout simply
// moves to the next training day.
function projectSchedule(S, fromDate, nDays){
  const out = []; const plan = S.plan; if (!plan) return out;
  let ptr = plan.pointer % plan.rotation.length;
  const today = isoDate();
  for (let i = 0; i < nDays; i++){
    const d = addDays(fromDate, i);
    const done = sessionsOn(S, d);
    if (d < today) { out.push({ date:d, past:true, done, training:isTrainingDay(S, d) }); continue; }
    if (d === today && done.length) { out.push({ date:d, done, training:true }); continue; }
    if (isTrainingDay(S, d)) { out.push({ date:d, training:true, workoutId: plan.rotation[ptr], done }); ptr = (ptr + 1) % plan.rotation.length; }
    else out.push({ date:d, training:false, done });
  }
  return out;
}
function todayPlan(S){
  const p = projectSchedule(S, isoDate(), 1)[0];
  return p;
}
function weekStats(S, refDate){
  const ws = weekStart(refDate || isoDate());
  const we = addDays(ws, 6);
  const sess = S.sessions.filter(s => s.end && s.date >= ws && s.date <= we);
  const target = S.plan ? S.plan.trainDays.length : (S.profile.daysPerWeek || 3);
  return { ws, we, done: sess.length, target, volume: sum(sess.map(s => s.volume)), sessions: sess };
}
function consistency(S){
  // planned training days in last 28 days (excluding today) vs sessions done in that window
  const today = isoDate(); let planned = 0;
  for (let i = 1; i <= 28; i++){ const d = addDays(today, -i); if (S.plan && S.plan.generatedAt && parseISO(d).getTime() < S.plan.generatedAt - 86400000) continue; if (isTrainingDay(S, d)) planned++; }
  const done = S.sessions.filter(s => s.end && s.date < today && daysBetween(s.date, today) <= 28).length;
  const score = planned ? Math.min(100, Math.round(done / planned * 100)) : null;
  // streak: consecutive weeks (completed weeks + current if on track) meeting the weekly target
  let streak = 0; let ws = weekStart(today);
  const cur = weekStats(S, today); if (cur.done >= cur.target) streak++;
  for (let k = 1; k < 52; k++){ const w = weekStats(S, addDays(ws, -7*k)); if (w.done >= w.target && w.done > 0) streak++; else break; }
  return { score, planned, done, weekStreak: streak };
}

/* ---------- Progressive overload ---------- */
function exerciseHistory(S, exId, beforeId){
  const out = [];
  const sorted = S.sessions.filter(s => s.end && s.id !== beforeId).sort((a,b) => b.start - a.start);
  for (const s of sorted){ for (const e of s.exercises){ if (e.exId === exId && e.sets.some(x => x.done)) out.push({ date:s.date, sessionId:s.id, ...e }); } }
  return out;
}
function doneSets(e){ return e.sets.filter(s => s.done && s.r > 0); }
function bestE1rm(e){ return Math.max(0, ...doneSets(e).map(s => e1rm(s.w, s.r))); }
function topWeight(e){ return Math.max(0, ...doneSets(e).map(s => s.w || 0)); }
function suggestNext(S, exId, planned, opts){
  opts = opts || {};
  const ex = EXERCISES[exId] || { inc:2.5, ratio:0, name:exId };
  const inc = ex.inc || 2.5; const bw = !ex.ratio;
  const hist = exerciseHistory(S, exId, opts.excludeSession);
  const deload = opts.deload;
  if (!hist.length){
    const w = planned.start || 0;
    return { weight:w, reps:planned.repMin, action:'start', reason: bw
      ? `No history yet. Do controlled reps aiming for ${planned.repMin}-${planned.repMax}, stopping 2-3 reps before failure. This session sets your baseline.`
      : `No history yet. Start at about ${w} kg (an estimate from your profile), keep 2-3 reps in reserve and adjust after the first set. This session sets your baseline.` };
  }
  const last = hist[0]; const sets = doneSets(last);
  const w = topWeight(last);
  const atTop = sets.filter(s => (s.w || 0) >= w);
  const rpes = sets.map(s => s.rpe).filter(Boolean);
  const avgRpe = avg(rpes);
  const pain = last.sets.some(s => s.pain);
  const allMax = atTop.length >= Math.min(planned.sets, sets.length) && atTop.every(s => s.r >= planned.repMax);
  const allMin = atTop.every(s => s.r >= planned.repMin);
  let res;
  if (pain){
    res = { weight: bw ? 0 : roundTo(w * 0.9, inc), reps: planned.repMin, action:'reduce', reason:`You flagged pain on this exercise last time (${last.date}). Use a lighter load or swap to an alternative, and stop if it hurts. Persistent pain is worth checking with a physio.` };
  } else if (allMax && (avgRpe == null || avgRpe <= 8.5) && !last.techIssue){
    if (bw) res = { weight:0, reps: planned.repMax + 1, action:'increase', reason:`You hit ${planned.repMax}+ reps on every set${avgRpe?` at about RPE ${r1(avgRpe)}`:''}. Add a rep per set, a slower tempo, or extra load (backpack/vest).` };
    else res = { weight: r1(w + inc), reps: planned.repMin, action:'increase', reason:`All ${atTop.length} sets reached ${planned.repMax} reps at ${w} kg${avgRpe?` with average RPE ${r1(avgRpe)}`:''}. Add ${inc} kg and work from ${planned.repMin} reps back up.` };
  } else if (allMax){
    res = { weight: w, reps: planned.repMax, action:'hold', reason:`You got the reps at ${w || 'bodyweight'}${w?' kg':''} but effort was high (RPE ${r1(avgRpe)}). Repeat it until it feels like RPE 8 or less before adding load.` };
  } else if (last.techIssue){
    res = { weight: w, reps: planned.repMin, action:'hold', reason:`You noted a technique issue last session. Keep ${w ? w + ' kg' : 'the same load'} and make every rep clean before progressing.` };
  } else if (allMin){
    res = { weight: w, reps: Math.min(planned.repMax, Math.max(...atTop.map(s => s.r)) + 1), action:'reps', reason:`You're inside the ${planned.repMin}-${planned.repMax} range at ${w ? w + ' kg' : 'bodyweight'}. Keep the weight and add a rep to any set you can. Increase load once every set hits ${planned.repMax}.` };
  } else {
    const prev = hist[1];
    const prevMissed = prev && topWeight(prev) >= w && doneSets(prev).filter(s => (s.w||0) >= w).some(s => s.r < planned.repMin);
    if (prevMissed && !bw) res = { weight: roundTo(w * 0.9, inc), reps: planned.repMin, action:'reduce', reason:`Reps fell below ${planned.repMin} at ${w} kg in two sessions in a row. Drop about 10% and build back up with clean reps.` };
    else res = { weight: w, reps: planned.repMin, action:'hold', reason:`Some sets fell short of ${planned.repMin} reps last time. Repeat ${w ? w + ' kg' : 'it'}; one tough day is not a trend. Check sleep and food if it repeats.` };
  }
  if (deload && !bw){ res.weight = roundTo((res.weight || w) * 0.85, inc); res.action = 'deload'; res.reason = 'Deload week: use about 85% of your normal load, fewer sets, and leave 3-4 reps in reserve. ' + res.reason; }
  res.last = { date:last.date, sets: sets.map(s => ({ w:s.w, r:s.r, rpe:s.rpe })) };
  return res;
}
function plateaus(S){
  const ids = new Set(); S.sessions.forEach(s => s.exercises.forEach(e => ids.add(e.exId)));
  const out = [];
  ids.forEach(id => {
    const h = exerciseHistory(S, id).filter(e => EXERCISES[id] && EXERCISES[id].ratio);
    if (h.length < 4) return;
    const recent = Math.max(...h.slice(0,3).map(bestE1rm));
    const before = Math.max(...h.slice(3).map(bestE1rm));
    if (recent <= before * 1.005) out.push({ exId:id, name:EXERCISES[id].name, sessions:h.length, best:r1(before), recent:r1(recent) });
  });
  return out;
}
function detectPRs(S, session){
  const prs = [];
  for (const e of session.exercises){
    const sets = doneSets(e); if (!sets.length) continue;
    const hist = exerciseHistory(S, e.exId, session.id);
    const name = (EXERCISES[e.exId] || {}).name || e.name;
    if (!hist.length) continue; // first time is a baseline, not a PR
    const prevW = Math.max(0, ...hist.map(topWeight));
    const prevE = Math.max(0, ...hist.map(bestE1rm));
    const prevR = Math.max(0, ...hist.map(h => Math.max(0, ...doneSets(h).map(s => s.r))));
    const w = topWeight(e), est = bestE1rm(e), reps = Math.max(...sets.map(s=>s.r));
    if (w > 0 && w > prevW) prs.push({ exId:e.exId, name, type:'Heaviest weight', value: w + ' kg' });
    else if (est > 0 && est > prevE * 1.001) prs.push({ exId:e.exId, name, type:'Estimated 1RM', value: r1(est) + ' kg' });
    else if (w === 0 && reps > prevR) prs.push({ exId:e.exId, name, type:'Most reps', value: reps + ' reps' });
  }
  return prs;
}
function sessionVolume(s){ return Math.round(sum(s.exercises.map(e => sum(doneSets(e).map(x => (x.w||0) * x.r))))); }
function deloadCheck(S){
  const reasons = [];
  const today = isoDate();
  const lastDeload = (S.sched || {}).lastDeload;
  const recent = S.sessions.filter(s => s.end).sort((a,b)=>a.start-b.start);
  if (recent.length){
    const since = lastDeload && lastDeload > recent[0].date ? lastDeload : recent[0].date;
    const weeks = Math.floor(daysBetween(since, today) / 7);
    const perWeek = recent.filter(s => s.date >= since).length / Math.max(1, weeks);
    if (weeks >= 6 && perWeek >= 2.5) reasons.push(`${weeks} weeks of steady training since your last lighter week.`);
  }
  const pl = plateaus(S); if (pl.length >= 3) reasons.push(`${pl.length} lifts have stalled for 3+ sessions.`);
  const sleep = avg(Object.entries(S.habits || {}).filter(([d]) => daysBetween(d, today) <= 7 && daysBetween(d, today) >= 0).map(([,h]) => h.sleep));
  const rpe = avg(recent.filter(s => daysBetween(s.date, today) <= 7).map(s => s.avgRpe));
  if (sleep != null && sleep < 6 && rpe != null && rpe >= 8.8) reasons.push(`Sleep averaged ${r1(sleep)} h this week while sessions felt very hard (RPE ${r1(rpe)}).`);
  const sore = avg(Object.entries(S.habits || {}).filter(([d]) => daysBetween(d, today) <= 5 && daysBetween(d, today) >= 0).map(([,h]) => h.soreness));
  if (sore != null && sore >= 4) reasons.push('You have logged high soreness several days running.');
  return { suggest: reasons.length > 0 && (reasons.length >= 2 || reasons[0].includes('weeks')), reasons };
}

/* ---------- Nutrition ---------- */
const ACTIVITY = { sedentary:{f:1.2,label:'Mostly sitting'}, light:{f:1.375,label:'On my feet some of the day'}, moderate:{f:1.55,label:'On my feet most of the day'}, active:{f:1.725,label:'Physical job'}, very:{f:1.9,label:'Heavy manual work'} };
function nutritionTargets(profile){
  const w = profile.weightKg, h = profile.heightCm, a = profile.age;
  if (!w || !h || !a) return null;
  const sexOff = profile.sex === 'male' ? 5 : profile.sex === 'female' ? -161 : -78;
  const bmr = 10*w + 6.25*h - 5*a + sexOff;
  const days = profile.daysPerWeek || 3;
  const act = (ACTIVITY[profile.activity] || ACTIVITY.light).f + Math.min(days, 6) * 0.025;
  const tdee = bmr * act;
  let kcal = tdee, note = 'Maintenance';
  const g = profile.goal;
  if (g === 'fat_loss'){ const def = Math.min(500, tdee * 0.18); kcal = tdee - def; note = `About ${Math.round(def)} kcal below estimated maintenance (roughly 0.3-0.5 kg/week)`; }
  else if (g === 'muscle_gain'){ kcal = tdee + Math.min(350, tdee * 0.1); note = 'Small surplus for lean gain (roughly 0.25 kg/week)'; }
  else if (g === 'recomp'){ kcal = tdee - Math.min(250, tdee * 0.08); note = 'Slight deficit with high protein'; }
  else if (g === 'strength'){ kcal = tdee + 150; note = 'Slightly above maintenance to support strength'; }
  const floor = profile.sex === 'male' ? 1600 : profile.sex === 'female' ? 1300 : 1450;
  kcal = Math.max(kcal, floor, bmr * 1.05);
  const protW = (g === 'fat_loss' && profile.targetWeight && profile.targetWeight < w) ? Math.max(profile.targetWeight, w * 0.85) : w;
  const pPerKg = g === 'fat_loss' || g === 'recomp' ? 2.0 : g === 'muscle_gain' || g === 'strength' ? 1.8 : 1.6;
  const p = Math.round(protW * pPerKg);
  const f = Math.round(Math.max(kcal * 0.27 / 9, w * 0.6));
  const c = Math.max(50, Math.round((kcal - p*4 - f*9) / 4));
  kcal = Math.round((p*4 + f*9 + c*4) / 10) * 10;
  return { kcal, p, c, f, fib: Math.round(kcal / 1000 * 14), water: Math.round((w * 35 + 500) / 250) * 250, bmr: Math.round(bmr), tdee: Math.round(tdee), note, pPerKg };
}
function foodMacros(foodId, grams, custom){
  const f = FOODS[foodId] || (custom || {})[foodId]; if (!f) return { kcal:0,p:0,c:0,f:0,fib:0 };
  const k = grams / 100;
  return { kcal: f.kcal*k, p: f.p*k, c: f.c*k, f: f.f*k, fib: (f.fib||0)*k };
}
function addMacros(a, b){ return { kcal:a.kcal+b.kcal, p:a.p+b.p, c:a.c+b.c, f:a.f+b.f, fib:(a.fib||0)+(b.fib||0) }; }
const ZERO = () => ({ kcal:0,p:0,c:0,f:0,fib:0 });
function itemsMacros(items, custom){ return items.reduce((m, [id, g]) => addMacros(m, foodMacros(id, g, custom)), ZERO()); }
function mealAllowed(meal, profile){
  const d = profile.diet || {};
  const banned = new Set();
  if (d.pref === 'vegetarian') ['meat','fish','shellfish'].forEach(t => banned.add(t));
  if (d.pref === 'pescatarian') banned.add('meat');
  if (d.pref === 'vegan') ['meat','fish','shellfish','dairy','egg'].forEach(t => banned.add(t));
  (d.flags || []).forEach(fl => { if (fl === 'dairy_free') banned.add('dairy'); if (fl === 'gluten_free') banned.add('gluten'); if (fl === 'nut_free') banned.add('nuts'); if (fl === 'egg_free') banned.add('egg'); if (fl === 'soy_free') banned.add('soy'); if (fl === 'shellfish_free') banned.add('shellfish'); });
  const words = ((d.allergies || '') + ',' + (d.dislikes || '')).toLowerCase().split(/[,;\n]/).map(s => s.trim()).filter(s => s.length > 2);
  for (const [id] of meal.items){
    const f = FOODS[id]; if (!f) continue;
    if (d.pref === 'vegan' && id === 'honey') return false;
    if (f.tags.some(t => banned.has(t))) return false;
    if (words.some(w => f.name.toLowerCase().includes(w) || id.includes(w) || f.tags.includes(w))) return false;
  }
  return true;
}
const SLOT_SHARE = { breakfast:0.25, lunch:0.3, dinner:0.3, snack:0.15 };
const SLOTS = ['breakfast','lunch','dinner','snack'];
function scaleMeal(meal, targetKcal, custom){
  const base = itemsMacros(meal.items, custom);
  const factor = Math.max(0.6, Math.min(1.9, targetKcal / Math.max(1, base.kcal)));
  const items = meal.items.map(([id, g]) => [id, Math.max(5, roundTo(g * factor, g * factor > 60 ? 10 : 5))]);
  return { mealId: meal.id, items, macros: itemsMacros(items, custom) };
}
function seededPick(arr, seed){ return arr[Math.abs(seed) % arr.length]; }
function mealPool(profile, slot, budgetMode){
  let list = MEALS.filter(m => m.slot === slot && mealAllowed(m, profile));
  if (budgetMode) list = list.slice().sort((a,b) => a.budget - b.budget);
  return list;
}
function generateDay(profile, targets, seed, opts){
  opts = opts || {};
  const day = {};
  SLOTS.forEach((slot, i) => {
    const pool = opts.pools ? opts.pools[slot] : mealPool(profile, slot, opts.budget);
    if (!pool || !pool.length) return;
    const meal = seededPick(pool, seed + i * 7);
    day[slot] = scaleMeal(meal, targets.kcal * SLOT_SHARE[slot], opts.custom);
  });

  lsGet(k){ try { const v = localStorage.getItem(this.ns + k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  lsSet(k, v){ try { localStorage.setItem(this.ns + k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  lsDel(k){ try { localStorage.removeItem(this.ns + k); } catch(e){} },
  lsKeys(){ const out = []; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith(this.ns)) out.push(k.slice(this.ns.length)); } } catch(e){} return out; },
  loadLocal(){
    const idx = this.lsGet('_index') || this.lsKeys().filter(k => !k.startsWith('_') && !k.startsWith('photo-'));
    idx.forEach(k => { const v = this.lsGet(k); if (v) this.docs[k] = v; });
  },
  saveIndex(){ this.lsSet('_index', Object.keys(this.docs)); },
  get(k){ return this.docs[k]; },
  put(k, v){ v._u = Date.now(); this.docs[k] = v; this.lsSet(k, v); this.saveIndex(); this.queue(k); },
  queue(k){ if (!this.db) return; this.pending.add(k); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 900); setSync('busy'); },
  async flush(){
    if (!this.db) return;
    const keys = [...this.pending].filter(k => !this.inflight.has(k));
    for (const k of keys){
      this.pending.delete(k); this.inflight.add(k);
      try {
        const v = this.docs[k];
        if (v === undefined) await this.col().doc(k).delete(); else await this.col().doc(k).set(JSON.parse(JSON.stringify(v)));
      } catch(e){
        if (e && e.code === 'unavailable'){ this.pending.add(k); setTimeout(() => this.flush(), 2000 + Math.random()*2000); }
        else if (e && e.code === 'quota_exceeded'){ toast('Cloud storage is full. Delete old photos to free space.'); }
        else { console.warn('sync', k, e); }
      }
      this.inflight.delete(k);
    }
    if (this.pending.size) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 600); }
    else setSync('ok');
  },
  col(){ return this.db.collection('data/users/' + this.uid); },
  photoCol(){ return this.db.doc('data/users/' + this.uid + '/photos').collection('items'); },
  async connect(){ try { await this._connect(); } finally { const was = this.ready; this.ready = true; if (!was) { rebuild(); render(); } } },
  async _connect(){
    if (!window.claude || !window.claude.use) { setSync('local'); return; }
    try {
      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      const id = user ? await user.id() : null;
      if (!db || !id) { setSync('local'); return; }
      this.db = db; this.uid = id; setSync('busy');
      const snap = await this.col().get();
      const remoteIds = new Set();
      let changed = false;
      snap.docs.forEach(d => {
        if (!d.exists) return; remoteIds.add(d.id);
        const r = d.data(); const l = this.docs[d.id];
        if (!l || (r._u || 0) > (l._u || 0)) { this.docs[d.id] = JSON.parse(JSON.stringify(r)); this.lsSet(d.id, this.docs[d.id]); changed = true; }
        else if ((l._u || 0) > (r._u || 0)) this.pending.add(d.id);
      });
      Object.keys(this.docs).forEach(k => { if (!remoteIds.has(k)) this.pending.add(k); });
      this.saveIndex();
      if (this.pending.size) await this.flush(); else setSync('ok');
      if (changed) { rebuild(); render(); }
    } catch(e){ console.warn('connect', e); this.db = null; setSync('local'); }
  },
  async putPhoto(id, dataUrl){
    if (this.db){ try { await this.photoCol().doc(id).set({ dataUrl, _u: Date.now() }); this.photoCache[id] = dataUrl; return true; } catch(e){ console.warn(e); } }
    if (this.lsSet('photo-' + id, dataUrl)) { this.photoCache[id] = dataUrl; return true; }
    return false;
  },
  async getPhoto(id){
    if (this.photoCache[id]) return this.photoCache[id];
    const l = this.lsGet('photo-' + id); if (l) { this.photoCache[id] = l; return l; }
    if (this.db){ try { const d = await this.photoCol().doc(id).get(); if (d.exists){ this.photoCache[id] = d.data().dataUrl; return this.photoCache[id]; } } catch(e){} }
    return null;
  },
  async delPhoto(id){ delete this.photoCache[id]; this.lsDel('photo-' + id); if (this.db) { try { await this.photoCol().doc(id).delete(); } catch(e){} } },
  async wipe(){
    const keys = Object.keys(this.docs);
    const photos = ((this.docs.body || {}).photos || []).map(p => p.id);
    for (const p of photos) await this.delPhoto(p);
    if (this.db){ for (const k of keys){ try { await this.col().doc(k).delete(); } catch(e){} } }
    this.lsKeys().forEach(k => this.lsDel(k));
    this.docs = {};
  }
};

const S = { daily:{}, dailycfg:{}, bookmarks:{ items:{} }, reportsDoc:{}, profile:null, settings:{}, plan:null, sched:{}, active:null, sessions:[], body:{entries:[],photos:[]}, food:{}, habits:{}, mealplan:null, coach:{msgs:[]}, custom:{} };
function rebuild(){
  const D = Store.docs;
  S.profile = D.profile || null; S.settings = D.settings || { theme:'dark', sound:true, useAI:true, reminders:{ weighin:true, water:true, review:true, meals:true, workout:true } };
  S.plan = D.plan || null; S.sched = D.sched || {}; S.active = D.active && D.active.session ? D.active.session : null;
  S.body = D.body || { entries:[], photos:[] }; S.mealplan = D.mealplan || null; S.coach = D.coach || { msgs:[] }; S.custom = (D.custom || {}).foods || {};
  S.sessions = []; S.food = {}; S.habits = {}; S.daily = {}; S.dailycfg = D.dailycfg || {}; S.bookmarks = D.bookmarks || { items:{} }; S.reportsDoc = D.reports || {};
  Object.keys(D).forEach(k => {
    if (k.startsWith('sess-')) S.sessions.push(...(D[k].list || []));
    else if (k.startsWith('food-')) Object.assign(S.food, D[k].days || {});
    else if (k.startsWith('habit-')) Object.assign(S.habits, D[k].days || {});
    else if (k.startsWith('daily-')) Object.assign(S.daily, D[k].days || {});
  });
  S.sessions.sort((a,b) => a.start - b.start);
  applyTheme();
}

}

/* ===== Charts (SVG, theme-aware) ===== */
function niceTicks(min, max, n){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min; const step0 = span / (n || 4); const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m => m * mag).find(s => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step; const out = [];
  for (let v = lo; v <= hi + step/2; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
// series: [{ name, color, pts:[{x:'YYYY-MM-DD'|number, y}], dashed, area }], opts: { h, target, unit, xType:'date'|'cat', labels }
function lineChart(series, opts){
  opts = opts || {}; const W = 640, H = opts.h || 200, L = 40, R = 14, T = 12, B = 26;
  const all = series.flatMap(s => s.pts); if (!all.length) return `<div class="empty small">No data yet</div>`;
  const xs = all.map(p => typeof p.x === 'string' ? parseISO(p.x).getTime() : p.x);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1){ x0 -= 86400000; x1 += 86400000; }
  const ysAll = all.map(p => p.y).concat(opts.target != null ? [opts.target] : []);
  let y0 = Math.min(...ysAll), y1 = Math.max(...ysAll); const padY = (y1 - y0) * 0.12 || Math.max(1, Math.abs(y1) * 0.05); y0 -= padY; y1 += padY;
  if (opts.zero) y0 = Math.min(0, y0);
  const ticks = niceTicks(y0, y1, 4); y0 = ticks[0]; y1 = ticks[ticks.length-1];
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  ticks.forEach(t => { g += `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${t}</text>`; });
  const nx = 4; for (let i = 0; i <= nx; i++){ const xv = x0 + (x1 - x0) * i / nx; const d = new Date(xv); g += `<text x="${X(xv)}" y="${H-8}" text-anchor="${i===0?'start':i===nx?'end':'middle'}">${d.getDate()} ${d.toLocaleDateString('en-AU',{month:'short'})}</text>`; }
  if (opts.target != null) g += `<line x1="${L}" x2="${W-R}" y1="${Y(opts.target)}" y2="${Y(opts.target)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${Y(opts.target)-5}" text-anchor="end" style="fill:var(--good)">target ${opts.target}${opts.unit||''}</text>`;
  series.forEach(s => {
    const pts = s.pts.map(p => [X(typeof p.x === 'string' ? parseISO(p.x).getTime() : p.x), Y(p.y)]);
    const d = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (s.area && pts.length > 1) g += `<path d="${d} L${pts[pts.length-1][0]} ${Y(y0)} L${pts[0][0]} ${Y(y0)} Z" fill="${s.color}" opacity=".12"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dashed ? 'stroke-dasharray="4 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => { const last = i === pts.length - 1; const tip = `${s.name ? s.name + ' · ' : ''}${typeof s.pts[i].x === 'string' ? fmtDate(s.pts[i].x) : s.pts[i].x}: ${s.pts[i].y}${opts.unit||''}`; if (pts.length < 40 || last) g += `<circle cx="${p[0]}" cy="${p[1]}" r="${last ? 4.5 : 2.6}" fill="${last ? s.color : 'var(--surface)'}" stroke="${s.color}" stroke-width="2"/>`; g += `<circle class="hit" cx="${p[0]}" cy="${p[1]}" r="11" fill="transparent" data-tip="${esc(tip)}"/>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'chart')}">${g}</svg>`;
}
// bars: [{ label, v, color }]
function barChart(bars, opts){
  opts = opts || {}; const W = 640, H = opts.h || 190, L = 40, R = 10, T = 12, B = 26;
  if (!bars.length) return `<div class="empty small">No data yet</div>`;
  const max = Math.max(1, ...bars.map(b => b.v), opts.target || 0); const ticks = niceTicks(0, max, 4); const y1 = ticks[ticks.length-1];
  const Y = y => T + (1 - y / y1) * (H - T - B); const bw = (W - L - R) / bars.length;

  ticks.forEach(t => { g += `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${t >= 10000 ? Math.round(t/1000)+'k' : t}</text>`; });
  bars.forEach((b, i) => { const x = L + i * bw + bw * 0.18, w = bw * 0.64, h = Y(0) - Y(b.v); g += `<rect x="${x}" y="${Y(b.v)}" width="${w}" height="${Math.max(0,h)}" rx="3" fill="${b.color || 'var(--accent)'}"/><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-tip="${esc((b.tip || b.label) + ': ' + (typeof b.v === 'number' ? b.v.toLocaleString('en-AU') : b.v) + (opts.unit || ''))}"/>`; if (bars.length <= 14 || i % 2 === 0) g += `<text x="${x + w/2}" y="${H-8}" text-anchor="middle">${esc(b.label)}</text>`; });
  if (opts.target) g += `<line x1="${L}" x2="${W-R}" y1="${Y(opts.target)}" y2="${Y(opts.target)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'bar chart')}">${g}</svg>`;
}
function sparkline(vals, color){
  if (vals.length < 2) return '';
  const W = 120, H = 34, mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
  const pts = vals.map((v,i) => [i / (vals.length - 1) * (W - 6) + 3, H - 4 - (v - mn) / sp * (H - 8)]);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${pts.map((p,i) => (i?'L':'M')+p[0]+' '+p[1]).join(' ')}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="${color}"/></svg>`;
}

function chartTip(e){
  const h = e.target.closest && e.target.closest('.hit'); let tip = document.getElementById('ctip');
  if (!h){ if (tip && e.type === 'pointerdown') tip.hidden = true; return; }
  if (!tip){ tip = document.createElement('div'); tip.id = 'ctip'; tip.className = 'ctip'; tip.setAttribute('role','status'); document.body.appendChild(tip); }
  tip.textContent = h.dataset.tip; tip.hidden = false;
  const r = h.getBoundingClientRect(); const x = Math.min(window.innerWidth - 12, Math.max(12, r.left + r.width / 2));
  tip.style.left = x + 'px'; tip.style.top = (r.top + window.scrollY - 8) + 'px';
}

function openSheet(html, onMount){

  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  s.addEventListener('click', e => { if (e.target === s) closeSheet(); });
  document.body.appendChild(s); if (onMount) onMount(s.querySelector('.sheet'));
  const f = s.querySelector('input,select,textarea'); if (f && !('ontouchstart' in window)) f.focus();
}
function closeSheet(){ const s = document.getElementById('scrim'); if (s) s.remove(); }
function confirmSheet(title, body, okLabel, onOk, danger){

function beep(){ if (!S.settings.sound || !audioCtx) return; try { [0, 0.25, 0.5].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = t === 0.5 ? 1175 : 880; g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.18); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2); }); } catch(e){} try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){} }
let wakeLock = null;

function tick(){
  const a = S.active; const clock = document.getElementById('clock'); if (a && clock) clock.textContent = mmss(elapsed(a));
  let bar = document.getElementById('restbar');
  if (!a || !a.rest){ if (bar) { bar.remove(); document.body.classList.remove('resting'); } return; }
  document.body.classList.add('resting');
  const left = (a.rest.until - Date.now()) / 1000;
  if (!bar){ bar = document.createElement('div'); bar.id = 'restbar'; bar.className = 'restbar'; bar.setAttribute('role','timer'); bar.innerHTML = `<div class="prog" id="rb-p"></div><div class="grow"><div class="eyebrow" id="rb-l" style="font-size:.7rem">Rest</div><div class="tm num" id="rb-t"></div></div><button class="btn sm" data-act="rest-adj" data-s="-15">−15</button><button class="btn sm" data-act="rest-adj" data-s="15">+15</button><button class="btn sm primary" data-act="rest-skip">${left > 0 ? 'Skip' : 'Close'}</button>`; document.body.appendChild(bar); }
  bar.classList.toggle('done', left <= 0);
  $('#rb-t', bar).textContent = left > 0 ? mmss(left) : 'Go!';
  $('#rb-l', bar).textContent = left > 0 ? 'Rest · next set of ' + (a.rest.name || '') : 'Rest done';

  if (!dl){ openSheet(`<div class="stack"><h2>Export</h2><p class="small muted">Downloads aren't available in this view. Copy the text below and save it in a note or file.</p><textarea class="in num" style="min-height:220px;font-size:11px" readonly id="exp-t">${esc(data)}</textarea><button class="btn primary" id="exp-c">Copy</button></div>`, sh => sh.querySelector('#exp-c').onclick = () => { const t = sh.querySelector('#exp-t'); navigator.clipboard.writeText(t.value).then(() => toast('Copied'), () => { t.select(); toast('Selected. Use Copy from the menu.'); }); }); return; }
  try { await dl.save({ filename: `drukfit-backup-${isoDate()}.json`, data: new Blob([data], { type:'application/json' }) }); toast('Export ready'); } catch(e){ if (e && e.code !== 'declined') toast('Export failed: ' + (e.message || 'try again')); }
};
CHANGES['import'] = el => { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); if (!['drukfit','ironlog'].includes(j.app) || !j.docs) throw new Error('not a DrukFit backup'); let n = 0; Object.entries(j.docs).forEach(([k, v]) => { const cur = Store.get(k); if (!cur || (v._u || 0) >= (cur._u || 0)) { Store.docs[k] = v; Store.lsSet(k, v); Store.queue(k); n++; } }); Store.saveIndex(); rebuild(); render(); toast(`Imported ${n} records`); } catch(e){ toast('That file isn\'t a valid backup'); } }; rd.readAsText(f); };
ACTIONS['wipe'] = () => openSheet(`<form class="stack" id="wipe-f"><h2>Delete all data?</h2><p class="muted small">This permanently deletes your profile, plan, every workout, food log, measurement and photo from this device and your account. Export first if you want a copy.</p><label class="f" for="wipe-t">Type DELETE to confirm<input class="in" id="wipe-t" autocomplete="off"></label><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn danger" type="submit">Delete everything</button></div></form>`, sh => sh.querySelector('#wipe-f').onsubmit = async e => { e.preventDefault(); if (sh.querySelector('#wipe-t').value.trim().toUpperCase() !== 'DELETE') { toast('Type DELETE to confirm'); return; } closeSheet(); toast('Deleting…'); await Store.wipe(); rebuild(); location.hash = 'dashboard'; render(); toast('All data deleted'); });

const WINANSI = { '–':150, '—':151, '‘':145, '’':146, '“':147, '”':148, '•':149, '·':183, '°':176, '±':177, '×':215, '…':133, 'é':233, '½':189 };

    else if (WINANSI[ch] || (c >= 160 && c <= 255)) out += '\\' + (WINANSI[ch] || c).toString(8).padStart(3, '0');

function saveDaily(date, patch){

  const cur = doc.days[date] || {};
  doc.days[date] = { ...cur, ...patch, manual:{ ...(cur.manual || {}), ...(patch.manual || {}) }, _u: Date.now() };
  saveDoc(k, doc);
}
function saveDailyCfg(patch){ saveDoc('dailycfg', { ...JSON.parse(JSON.stringify(S.dailycfg || {})), ...patch }); }
function bookmarked(id){ return !!(((S.bookmarks || {}).items || {})[id]); }
function toggleBookmark(id){
  const doc = JSON.parse(JSON.stringify(Store.get('bookmarks') || { items:{} })); doc.items = doc.items || {}; doc.del = doc.del || []; doc.delT = doc.delT || {};
  if (doc.items[id]){ delete doc.items[id]; if (!doc.del.includes(id)) doc.del.push(id); doc.delT[id] = Date.now(); saveDoc('bookmarks', doc); return false; }
  const a = Feed.find(id); if (!a) return false;
  const keep = ['id','kind','category','title','summary','source','source_title','url','published','published_year','last_reviewed','doi','study_type','participants','limitations','why','quote','quote_from','apply','evergreen','reviewed','status','authors','record_url','source_note','checked_on','link_checked'];

}

function pushSupport(){
  const ua = navigator.userAgent; const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

function nearestBody(field, date){

  s.forEach(x => { const d = Math.abs(daysBetween(x.date, date)); if (d <= 10 && (!best || d < best.d)) best = { ...x, d }; });
  return best;
}
function photoCompare(a, b){

    const diff = x && y ? Math.round((y.v - x.v) * 10) / 10 : null;
    return `<div class="pstat"><span class="tiny faint">${label}</span><b class="num small">${x ? x.v + ' ' + unit : '–'} → ${y ? y.v + ' ' + unit : '–'}</b>${diff != null ? `<span class="tiny ${diff === 0 ? 'faint' : ''}">${diff === 0 ? 'no change' : (diff > 0 ? '+' : '') + diff + ' ' + unit}</span>` : ''}</div>`; };

  if (!e) return 'Something went wrong. Please try again.';
  if (e.offline) return 'Can\'t reach DrukFit. Check your internet connection and try again.';
  const c = String(e.code || ''), m = String(e.message || '').toLowerCase();
  if (c === 'invalid_credentials' || c === 'invalid_grant' && m.includes('invalid login') || m.includes('invalid login credentials')) return 'Email or password is incorrect.';
  if (c === 'email_not_confirmed' || m.includes('email not confirmed')) return 'Please confirm your email address first. Check your inbox (and spam folder) for the link.';
  if (c === 'weak_password' || m.includes('password should')) return 'Choose a stronger password: at least 8 characters with letters and numbers.';
  if (c === 'same_password') return 'Your new password must be different from your current one.';
  if (e.status === 429 || c.includes('rate_limit')) return 'Too many attempts. Please wait a minute and try again.';
  if (c === 'email_address_invalid' || m.includes('invalid format') || m.includes('email address') && m.includes('invalid')) return 'Enter a valid email address.';
  if (c === 'signup_disabled') return 'New sign-ups are currently turned off.';
  if (c === 'otp_expired' || m.includes('expired')) return 'That link has expired. Request a new one.';
  if (e.status >= 500) return 'DrukFit\'s server had a problem. Please try again shortly.';
  return e.message || 'Something went wrong. Please try again.';
}

const Auth = {
  session: null, refreshing: null,
  load(){ try { this.session = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch(e){ this.session = null; } return this.session; },

  async signUp(email, password, displayName){

  },
  async signIn(email, password){ const s = this.sessionFrom(await this.raw('/auth/v1/token?grant_type=password', { method:'POST', json:{ email, password } })); this.persist(s); return s; },
  async verifyPassword(password){ const s = this.sessionFrom(await this.raw('/auth/v1/token?grant_type=password', { method:'POST', json:{ email: this.user.email, password } })); this.persist(s); return true; },

  async recover(email){ await this.raw('/auth/v1/recover?redirect_to=' + encodeURIComponent(this.redirectTo()), { method:'POST', json:{ email } }); },
  async resend(email){ await this.raw('/auth/v1/resend?redirect_to=' + encodeURIComponent(this.redirectTo()), { method:'POST', json:{ type:'signup', email } }); },

/* ---------- Merging when two devices changed the same document ---------- */
function unionById(a, b, del, preferA){ const out = new Map(); (b || []).forEach(x => out.set(x.id, x)); (a || []).forEach(x => { const o = out.get(x.id); if (!o || preferA || (x._u || 0) >= (o._u || 0)) out.set(x.id, x); }); return [...out.values()].filter(x => !del.has(x.id)); }
function mergeDoc(key, a, b){ // a = this device, b = account copy
  if (!a) return b; if (!b) return a;
  const _u = Math.max(a._u || 0, b._u || 0);
  if (/^sess-/.test(key)){ const del = new Set([...(a.del || []), ...(b.del || [])]); const list = unionById(a.list, b.list, del, true).sort((x, y) => x.start - y.start); return { ...b, ...a, list, del:[...del], _u }; }
  if (/^daily-/.test(key)){
    const days = { ...(b.days || {}) };
    Object.entries(a.days || {}).forEach(([d, da]) => { const db = days[d]; if (!db){ days[d] = da; return; } const [o, n] = (da._u || 0) >= (db._u || 0) ? [db, da] : [da, db]; days[d] = { ...o, ...n, manual:{ ...(o.manual || {}), ...(n.manual || {}) }, tipRead: !!(o.tipRead || n.tipRead), ch: n.ch || o.ch }; });
    return { ...b, ...a, days, _u };
  }
  if (key === 'bookmarks'){ const del = new Set([...(a.del || []), ...(b.del || [])]); const items = { ...(b.items || {}), ...(a.items || {}) }; [...del].forEach(id => { const ia = (a.items || {})[id], ib = (b.items || {})[id]; const latest = Math.max((ia && ia.t) || 0, (ib && ib.t) || 0); if (!(latest > ((a.delT || {})[id] || (b.delT || {})[id] || 0))) delete items[id]; }); return { items, del:[...del], delT:{ ...(b.delT || {}), ...(a.delT || {}) }, _u }; }
  if (/^(food|habit)-/.test(key)){
    const days = { ...(b.days || {}) };
    Object.entries(a.days || {}).forEach(([d, da]) => {
      const db = days[d]; if (!db){ days[d] = da; return; }
      const [older, newer] = (da._u || 0) >= (db._u || 0) ? [db, da] : [da, db];
      const m = { ...older, ...newer };
      if (da.entries || db.entries){ const del = new Set([...(da.del || []), ...(db.del || [])]); m.entries = unionById(newer.entries, older.entries, del, true); m.del = [...del]; }
      days[d] = m;
    });
    return { ...b, ...a, days, _u };
  }
  if (key === 'body'){ const del = new Set([...(a.del || []), ...(b.del || [])]); const newer = (a._u || 0) >= (b._u || 0) ? a : b; return { ...newer, entries: unionById(a.entries, b.entries, del).sort((x, y) => x.date < y.date ? -1 : 1), photos: unionById(a.photos, b.photos, del, true), del:[...del], _u }; }
  if (key === 'reports'){ return { ...b, ...a, ai:{ ...(b.ai || {}), ...(a.ai || {}) }, saved:{ ...(b.saved || {}), ...(a.saved || {}) }, _u }; }
  if (key === 'coach'){ const seen = new Set(); const msgs = [...(b.msgs || []), ...(a.msgs || [])].sort((x, y) => (x.t || 0) - (y.t || 0)).filter(m => { const k = m.t + m.role + m.text; if (seen.has(k)) return false; seen.add(k); return true; }).slice(-40); return { ...a, msgs, _u }; }
  if (key === 'custom'){ return { foods:{ ...(b.foods || {}), ...(a.foods || {}) }, _u }; }
  return (a._u || 0) >= (b._u || 0) ? a : b;
}

/* ---------- Cloud sync ---------- */
const Cloud = {
  phase: 'boot', flow: null, notice: null, meta: { revs:{}, pending:[], photoQueue:[], lastSync:0 }, timer: null, backoff: 0, pulling: false, renderDeferred: false, failToastAt: 0,
  get uid(){ return Auth.user && Auth.user.id; },
  saveMeta(){ this.meta.pending = [...Store.pending]; Store.lsSet('_sync', this.meta); },
  loadMeta(){ const m = Store.lsGet('_sync') || {}; this.meta = { revs: m.revs || {}, pending: m.pending || [], photoQueue: m.photoQueue || [], lastSync: m.lastSync || 0 }; Store.pending = new Set(this.meta.pending); },
  async startUser(user){

  dismissedMigration(){ return !!Store.lsGet('_migrateDone'); },

  },
  safeRender(){ const a = document.activeElement; if (a && a.closest && a.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ this.renderDeferred = true; return; } render(); },
  queue(k){ Store.pending.add(k); this.saveMeta(); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 700); if (Store.status !== 'offline') setSync('busy'); },

    const keys = [...Store.pending].filter(k => !Store.inflight.has(k));
    if (!keys.length){ if (!Store.inflight.size && !this.meta.photoQueue.length) setSync('ok'); return; }
    setSync('busy');

  netFail(e){

  sessionExpired(){ this.notice = 'Your login has expired. Log in again to keep syncing. Nothing on this device has been lost.'; this.phase = 'expired'; setSync('error'); render(); },
  /* photos: <uid>/<id>.jpg in the private bucket + an index row */
  async uploadPhoto(id, date, dataUrl){
    const path = this.uid + '/' + id + '.jpg'; const blob = await (await fetch(dataUrl)).blob();
    await Auth.api('/storage/v1/object/progress-photos/' + path, { method:'POST', body: blob, headers:{ 'Content-Type':'image/jpeg', 'x-upsert':'true' } });
    await Auth.api('/rest/v1/progress_photos?on_conflict=user_id,id', { method:'POST', json:{ id, user_id: this.uid, taken_on: date, path }, headers:{ Prefer:'resolution=merge-duplicates,return=minimal' } });
  },
  async flushPhotos(){

      const d = Store.lsGet('photo-' + p.id) || Store.photoCache[p.id]; if (!d){ this.meta.photoQueue = this.meta.photoQueue.filter(x => x.id !== p.id); continue; }

};
function legacyData(){ // DrukFit data saved on this device before accounts existed
  try { const raw = localStorage.getItem(LEGACY_NS + 'profile'); if (!raw) return null; const p = JSON.parse(raw); if (!p || !p.onboarded) return null;

    const docs = {}; keys.filter(k => !k.startsWith('photo-')).forEach(k => { try { docs[k] = JSON.parse(localStorage.getItem(LEGACY_NS + k)); } catch(e){} });
    const sessions = Object.keys(docs).filter(k => k.startsWith('sess-')).reduce((n, k) => n + ((docs[k] || {}).list || []).filter(s => !s.demo).length, 0);
    return { docs, name: p.name || '', demo: !!(docs.settings && docs.settings.demo), sessions, weighIns: ((docs.body || {}).entries || []).length, foodDays: Object.keys(docs).filter(k => k.startsWith('food-')).reduce((n, k) => n + Object.keys((docs[k] || {}).days || {}).length, 0), photos: keys.filter(k => k.startsWith('photo-')).map(k => k.slice(6)) };
  } catch(e){ return null; }
}

/* ---------- Store overrides for the website build ---------- */
if (CLOUD){
  Store.loadLocal = function(){ if (this.ns === LS) return; const idx = this.lsGet('_index') || this.lsKeys().filter(k => !k.startsWith('_') && !k.startsWith('photo-')); idx.forEach(k => { const v = this.lsGet(k); if (v) this.docs[k] = v; }); };
  Store.queue = function(k){ if (Cloud.uid) Cloud.queue(k); };
  Store.flush = function(){ return Cloud.flush(); };
  Store.connect = async function(){ await cloudBoot(); };
  Store.putPhoto = async function(id, dataUrl){

  };

    try { const t = await Auth.token(); const res = await fetch(CLOUD.url + '/storage/v1/object/authenticated/progress-photos/' + Cloud.uid + '/' + id + '.jpg', { headers:{ apikey: CLOUD.key, Authorization:'Bearer ' + t } }); if (!res.ok) return null;
      const b = await res.blob(); const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); this.photoCache[id] = url; this.lsSet('photo-' + id, url); return url; } catch(e){ return null; }

  };

  window.addEventListener('online', () => { Cloud.pull().then(() => Cloud.flush()); });
  window.addEventListener('offline', () => setSync('offline'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Cloud.uid) Cloud.pull().then(() => Cloud.flush()); });
  document.addEventListener('focusout', () => setTimeout(() => { if (Cloud.renderDeferred && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){ Cloud.renderDeferred = false; render(); } }, 50));
  setInterval(() => { if (Cloud.uid && Cloud.phase === 'ready' && document.visibilityState === 'visible' && navigator.onLine) Cloud.pull(); }, 60000);
}
async function cloudBoot(){
  const r = await Auth.handleRedirect();
  if (r && r.error){ Cloud.notice = r.error; route = 'login'; }
  if (r && r.type === 'recovery') Cloud.flow = 'recovery';
  else if (r && (r.type === 'signup' || r.type === 'magiclink')) Cloud.notice = 'Email confirmed. Welcome to DrukFit!';
  else if (r && r.type === 'email_change') Cloud.notice = 'Your email address has been updated.';
  Auth.load();
  if (!Auth.session){ Cloud.phase = 'out'; Store.ready = true; render(); return; }
  if (!Auth.user){ try { await Auth.getUser(); } catch(e){ if (!e.offline){ Auth.persist(null); Cloud.phase = 'out'; Store.ready = true; render(); return; } } }
  await Cloud.startUser(Auth.user);
  if (Cloud.notice && Cloud.phase === 'ready'){ toast(Cloud.notice); Cloud.notice = null; }

/* ---------- Gate: what to show before the main app ---------- */
const PUBLIC_ROUTES = ['welcome','login','signup','forgot','check-email','privacy','terms'];
function cloudGate(main){
  if (!CLOUD) return false;
  sideAccount();
  // keep anything typed into the account forms when the screen is redrawn in the background
  const keep = {}; let focusId = document.activeElement && document.activeElement.id;
  main.querySelectorAll('input[id]').forEach(el => { if (/^(li|su|fg|rp)-/.test(el.id)) keep[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
  const handled = cloudGateInner(main);
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el && !el.readOnly){ if (el.type === 'checkbox') el.checked = v; else if (v) el.value = v; } });
  if (focusId && keep[focusId] !== undefined){ const f = document.getElementById(focusId); if (f) f.focus(); }
  return handled;
}
function cloudGateInner(main){
  const r = route.split('/')[0];
  const hideNav = () => { document.querySelector('.tabbar').hidden = true; document.querySelector('.side').hidden = true; };
  if (/(^|&)(access_token|error_code|error)=/.test(location.hash.slice(1))){ // email link opened in a tab that already had DrukFit open
    hideNav(); main.innerHTML = `<div class="boot">${logoSvg(110)}<div class="spin" aria-hidden="true"></div><p class="muted">Signing you in…</p></div>`;
    if (!Cloud.redirecting){ Cloud.redirecting = true; clearTimeout(Cloud.timer); cloudBoot().finally(() => { Cloud.redirecting = false; }); }
    return true;
  }
  if (r === 'privacy' || r === 'terms'){ hideNav(); main.innerHTML = legalView(r); return true; }
  if (Cloud.phase === 'boot'){ hideNav(); main.innerHTML = `<div class="boot">${logoSvg(110)}<div class="brandmark">Druk<b>Fit</b></div><div class="spin" aria-hidden="true"></div></div>`; return true; }
  if (Cloud.flow === 'recovery' && Auth.session){ hideNav(); main.innerHTML = authShell(resetPasswordForm()); return true; }
  if (!Auth.session || Cloud.phase === 'out'){ hideNav(); main.innerHTML = authView(PUBLIC_ROUTES.includes(r) ? r : 'welcome'); return true; }

    toast('Couldn\'t log out. Please try again.');
  }
}
ACTIONS['acct-logout-force'] = el => cloudLogout(true, el);
/* profile menu on the avatar (desktop and phone) */
function closeAcctMenu(){ const m = document.getElementById('acct-menu'); if (m) m.remove(); const b = document.getElementById('acct-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }
ACTIONS['acct-menu'] = el => {
  if (document.getElementById('acct-menu')){ closeAcctMenu(); return; }
  const u = Auth.user || {}; const name = (u.user_metadata || {}).display_name || (S.profile && S.profile.name) || 'Your account';
  const m = document.createElement('div'); m.id = 'acct-menu'; m.className = 'acct-menu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<div class="am-head"><b>${esc(name)}</b><span class="small muted">${esc(u.email || '')}</span></div>
    <a href="#settings" role="menuitem" class="am-item" data-act="acct-menu-close">${I('user')} Profile &amp; Settings</a>

    <button role="menuitem" class="am-item out" data-act="logout-ask">${I('logout')} Log out</button>`;
  const r = el.getBoundingClientRect(); m.style.top = (r.bottom + window.scrollY + 8) + 'px'; m.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
  document.body.appendChild(m); el.setAttribute('aria-expanded', 'true'); m.querySelector('.am-item').focus();

ACTIONS['acct-menu-close'] = el => { closeAcctMenu(); location.hash = el.getAttribute('href').slice(1); };

function sideAccount(){ // desktop sidebar: who is signed in + Log out
